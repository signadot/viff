# A two-level ping-pong: a cycle at each level, and the lower one re-igniting the upper
# one every lap.
#
# It installs cleanly. Every level check passes — which is the point. Strata rule out the
# write that would close a loop ACROSS levels; recursion inside a level is exactly what a
# level ordering permits, and what the cycle throttle is for. See docs/strata.md.
#
#   scripts/level-ping-pong.sh          # brings up an isolated verse and watches it
#
# The shape:
#
#   gh:issue:1        triaged ⇄ labeled                    (label-fwd / label-back)
#        │
#        │ derive — the one write that crosses, and it can only climb
#        ▼
#   signadot:feature  drafted ⇄ reviewing                  (review-fwd / review-back)
#        ▲
#        └── start-review re-ignites the upper cycle on every lap of the lower one,
#            because its `when` reads the issue reaching `labeled` — which happens
#            once per lap. Reads may go anywhere; only WRITES are ordered.
#
# The throttle names both cycles, separately, one per subject. That is worth knowing
# because it is not automatic: a chain is PER SUBJECT, and start-review is woken by a
# change to the issue rather than to its own subject, so it begins a fresh chain instead
# of extending the lower one. Ignite the upper cycle from the derive instead — drop
# start-review's `when` — and the two chains link, share a root, and the deduplication
# by chain root means only the lower cycle is ever reported at WARN.

- name: triage
  level: 0
  match: "gh"
- name: sdlc
  level: 10
  match: "signadot"

---

# ── level 0: the issue bounces between two stages ────────────────────────────
- name: label-fwd
  stratum: triage
  condition:
    subject: { system: gh, kind: issue, value: { stage: triaged } }
  action:
    patch: { stage: labeled }

- name: label-back
  stratum: triage
  condition:
    subject: { system: gh, kind: issue, value: { stage: labeled } }
  action:
    patch: { stage: triaged }

# ── the one write that crosses ───────────────────────────────────────────────
# Fires every lap, and commits once. A derive's content is literal, so the second and
# every later firing writes the same bytes to the same address — a no-op the store
# ends. That inertness is what lets reads go anywhere.
- name: raise-feature
  stratum: triage
  condition:
    subject: { system: gh, kind: issue, value: { stage: labeled } }
  action:
    derive:
      signadot:
        feature:
          priority: urgent
          # $subject is the ONE reference a derive may carry, and it resolves to the whole
          # ref — "gh:issue:1" — which is a match address as it stands. It is admitted where
          # $result is refused because it is fixed by (rule, subject), the same pair the
          # derived entity's ADDRESS is fixed by: so a re-fire still writes identical bytes
          # to an identical address, and a rule reading a higher level stays inert.
          #
          # Under a key of your choosing, so a spawn at the level above can bind it flatly
          # (`task: "approve $what"`). The engine also records it at verse.meta.derivedFrom,
          # nested, where a spawn's older flat substitution cannot reach it.
          what: $subject

# ── the coupling: a lower lap re-ignites the upper cycle ─────────────────────
# The subject is at level 10 (this rule's own), and the `on` reads level 0. A read
# downward — or upward — is unrestricted; what the ordering constrains is where a
# write may LAND.
- name: start-review
  stratum: sdlc
  condition:
    subject: { system: signadot, kind: feature, value: { priority: urgent } }
    on:    { system: gh, kind: issue, value: { stage: labeled } }
  action:
    patch: { phase: drafted }

# ── level 10: the derived feature bounces between two phases ─────────────────
- name: review-fwd
  stratum: sdlc
  condition:
    subject: { system: signadot, kind: feature, value: { phase: drafted } }
  action:
    patch: { phase: reviewing }

- name: review-back
  stratum: sdlc
  condition:
    subject: { system: signadot, kind: feature, value: { phase: reviewing } }
  action:
    patch: { phase: drafted }
