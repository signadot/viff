<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>verse console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root{
  --ground:#E9ECE7;--surface:#F5F7F3;--surface-2:#DEE4DB;--ink:#171C18;--ink-2:#3E4842;
  --muted:#6A746C;--faint:#96A098;--rule:#C3CABF;--rule-soft:#D5DBD1;
  --accent:#14566B;--accent-soft:#D3E1E6;--live:#1F7A4D;--live-soft:#D2E6DA;
  --wait:#9C6410;--wait-soft:#F0E2CA;--fail:#A3352B;--fail-soft:#F2D9D5;
  --grid:rgba(23,28,24,.045);--shadow:0 1px 2px rgba(23,28,24,.06),0 6px 18px -10px rgba(23,28,24,.22);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1311;--surface:#151B18;--surface-2:#1E2622;--ink:#DFE6DF;--ink-2:#B4BFB7;
  --muted:#818E85;--faint:#5C685F;--rule:#2B342E;--rule-soft:#222A25;
  --accent:#5EB6CE;--accent-soft:#17323B;--live:#4FC287;--live-soft:#14301F;
  --wait:#DFA44E;--wait-soft:#33260F;--fail:#E3786A;--fail-soft:#361814;
  --grid:rgba(223,230,223,.05);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0E1311;--surface:#151B18;--surface-2:#1E2622;--ink:#DFE6DF;--ink-2:#B4BFB7;
  --muted:#818E85;--faint:#5C685F;--rule:#2B342E;--rule-soft:#222A25;
  --accent:#5EB6CE;--accent-soft:#17323B;--live:#4FC287;--live-soft:#14301F;
  --wait:#DFA44E;--wait-soft:#33260F;--fail:#E3786A;--fail-soft:#361814;
  --grid:rgba(223,230,223,.05);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:900px){body{overflow:auto}}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px 20px;
  padding-top:calc(11px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--rule);
  background:var(--surface);flex:none}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:15px;font-weight:700}
.brand span{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.conn{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);
  padding-left:15px;border-left:1px solid var(--rule)}
.led{width:7px;height:7px;border-radius:50%;background:var(--fail)}
.led.ok{background:var(--live);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.counts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border:1px solid var(--rule);
  border-radius:2px;background:var(--ground)}
.count b{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.count span{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.count.w{border-color:var(--wait);background:var(--wait-soft)}.count.w b{color:var(--wait)}
.count.l b{color:var(--live)}
.tgl{padding:5px 9px;border:1px solid var(--rule);border-radius:2px;font-size:11px;color:var(--muted)}
.tgl:hover{color:var(--ink);border-color:var(--accent)}

.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--surface);flex:none;
  padding:0 14px;overflow-x:auto}
.tab{padding:9px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:10px;background:var(--surface-2);color:var(--muted);padding:1px 5px;border-radius:2px}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}

.work{flex:1;display:flex;min-height:0}
@media (max-width:900px){.work{flex-direction:column}}
.rail{width:240px;flex:none;border-right:1px solid var(--rule);background:var(--surface);
  overflow-y:auto;padding:12px 0}
@media (max-width:900px){.rail{width:auto;border-right:none;border-bottom:1px solid var(--rule)}}
h3.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px;padding:0 16px}
.row{display:block;width:100%;text-align:left;padding:8px 16px;border-left:2px solid transparent}
.row:hover{background:var(--ground)}
.row[aria-current="true"]{border-left-color:var(--accent);background:var(--ground)}
.row .a{font-family:var(--mono);font-size:11.5px;display:block;word-break:break-all;line-height:1.3}
.row .b{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:var(--live)}.dot.wait{background:var(--wait)}.dot.fail{background:var(--fail)}
.legend{padding:13px 16px;margin-top:8px;border-top:1px solid var(--rule-soft)}
.lg{display:flex;gap:9px;margin-bottom:9px;font-size:10.5px;color:var(--muted);line-height:1.35}
.lg .sw{width:20px;height:13px;flex:none;border-radius:2px;margin-top:1px}
.lg b{display:block;color:var(--ink-2);font-size:10.5px}
.sw.registry{background:var(--live-soft);border:1.5px solid var(--live)}
.sw.mirror{background:var(--surface-2);border:1.5px solid var(--rule)}
.sw.charter{border:1.5px dashed var(--accent);opacity:.75}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;background:var(--ground)}
.main.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.chead{position:sticky;top:0;z-index:5;padding:10px 20px;border-bottom:1px solid var(--rule-soft);
  background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(6px);
  display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.chead .t{font-family:var(--mono);font-size:13px;font-weight:600;word-break:break-all}
.chip{font-family:var(--mono);font-size:10px;padding:2px 7px;border:1px solid var(--rule);
  border-radius:2px;color:var(--muted);background:var(--surface);white-space:nowrap}
.pad{padding:18px 20px 40px}
.wrap{max-width:820px}

.stage{position:relative;padding:20px 24px 40px;min-width:max-content}
.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:3px;padding:8px 10px;background:var(--surface);
  border:1.5px solid var(--rule);text-align:left;box-shadow:var(--shadow)}
.node:hover{transform:translateY(-1px)}
.node[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.node .k{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  display:flex;gap:5px;margin-bottom:3px}
.node .c{font-family:var(--mono);font-size:11.5px;font-weight:600;word-break:break-all;line-height:1.25}
.node .m{font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.registry{border-color:var(--live);background:var(--live-soft)}
.node.charter{border-style:dashed;border-color:var(--accent);background:transparent;box-shadow:none;opacity:.8}
.node.charter .c{color:var(--accent)}
.node.mirror{background:var(--surface-2)}
.node.bad{border-color:var(--fail);background:var(--fail-soft)}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--live);flex:none;animation:pulse 1.8s ease-in-out infinite}

.insp{width:330px;flex:none;border-left:1px solid var(--rule);background:var(--surface);
  overflow-y:auto;padding:14px 0 30px}
@media (max-width:900px){.insp{width:auto;border-left:none;border-top:1px solid var(--rule)}}
.insp .body{padding:0 16px}
.hd{font-family:var(--mono);font-size:12.5px;font-weight:600;word-break:break-all;line-height:1.3}
.sub{font-size:11px;color:var(--muted);margin-top:4px}
.pose{margin:12px 0;padding:10px 12px;background:var(--ground);border-left:2px solid var(--accent);
  font-size:12.5px;line-height:1.45;word-break:break-word}
dl.f{display:grid;grid-template-columns:auto 1fr;gap:5px 11px;margin:12px 0;align-items:baseline}
dl.f dt{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}
dl.f dd{margin:0;font-family:var(--mono);font-size:11px;color:var(--ink-2);word-break:break-all;line-height:1.35}
.sect{margin:15px 0 0;padding-top:12px;border-top:1px solid var(--rule-soft)}
.sect h4{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px}
.opt{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:12px}
.opt:last-child{border-bottom:none}
.opt .oid{font-family:var(--mono);font-weight:600;flex:1}
.opt .need{font-family:var(--mono);font-size:10px;color:var(--muted)}
.ballots{display:inline-flex;gap:2.5px}
.ballots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.ballots i.on{background:var(--wait)}
.spawn{font-family:var(--mono);font-size:10.5px;padding:6px 8px;margin-bottom:4px;
  border:1.5px dashed var(--accent);border-radius:2px;color:var(--accent);word-break:break-all}
.acts{display:flex;gap:6px;margin:13px 0 4px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:2px;font-size:12px;font-weight:600;border:1.5px solid var(--rule);
  background:var(--ground)}
.btn:hover{border-color:var(--ink-2)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ok:hover{filter:brightness(1.12)}
.btn.no:hover{border-color:var(--fail);color:var(--fail)}
.btn.sm{padding:5px 9px;font-weight:500;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:9px}
.err{margin:10px 0;padding:9px 11px;border:1px solid var(--fail);background:var(--fail-soft);
  border-radius:2px;font-size:11.5px;color:var(--ink);word-break:break-word}
.empty{padding:34px 20px;text-align:center;color:var(--faint);font-size:12px;line-height:1.55}

.card{border:1px solid var(--rule);border-radius:2px;background:var(--surface);margin-bottom:10px;
  width:100%;text-align:left}
.card.gate{border-left:3px solid var(--wait);padding:14px 16px;display:block}
.card.gate:hover{border-color:var(--accent);border-left-color:var(--wait)}
.card .q{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:5px;word-break:break-word}
.card .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all;line-height:1.45}
pre.tony{font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--surface);
  border:1px solid var(--rule);border-radius:2px;padding:12px 14px;overflow-x:auto;margin:0 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-family:var(--mono);font-size:11.5px}
.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--ink-2);word-break:break-all}
h2.head{font-size:16px;font-weight:700;margin:0 0 4px}
p.headp{margin:0 0 16px;font-size:12px;color:var(--muted);max-width:62ch;line-height:1.5}
.foot{font-size:10.5px;color:var(--faint);padding:8px 20px;border-top:1px solid var(--rule-soft);
  background:var(--surface);flex:none;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <div class="brand"><b>verse</b><span>console</span></div>
  <div class="conn"><i class="led" id="led"></i><span id="conn">connecting…</span></div>
  <div class="counts">
    <div class="count w"><b id="c-gate">·</b><span>gate</span></div>
    <div class="count l"><b id="c-task">·</b><span>task</span></div>
    <div class="count"><b id="c-rule">·</b><span>rule</span></div>
    <div class="count"><b id="c-rev">·</b><span>storeRev</span></div>
    <button class="tgl" id="theme">theme</button>
  </div>
</header>

<nav class="tabs" role="tablist" id="tabs"></nav>
<div id="views" style="flex:1;display:flex;min-height:0"></div>
<div class="foot" id="foot">—</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yaml = t => { try { return jsyaml.load(t); } catch(e){ return null; } };

/* ── the verse ───────────────────────────────────────────── */
let PRINCIPAL = "", ADDR = "", ONLINE = false, ERR = "";
async function get(route){
  const r = await fetch("/v"+route, {headers:{"Accept":"application/yaml"}});
  const t = await r.text();
  if (!r.ok) throw new Error(t.trim() || r.status);
  return yaml(t);
}
async function post(route, body){
  const r = await fetch("/v"+route, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const t = await r.text();
  if (!r.ok) throw new Error(t.trim() || r.status);
  return t;
}

/* ── state ───────────────────────────────────────────────── */
const S = {view:"gate", status:null, gates:[], flows:[], tasks:null, charter:null,
           schedules:null, runners:null, ios:null, resolvers:null, tree:null, subject:null,
           sel:null, entity:null, entityAt:"", errs:{}};

/* verse's own nouns, in the order the CLI lists them */
const TABS = [
  {id:"gate",     label:"gate",     count:()=>S.gates.length},
  {id:"flow",     label:"flow",     count:()=>S.flows.length},
  {id:"charter",  label:"charter",  count:()=>S.charter?.rules?.length},
  {id:"task",     label:"task",     count:()=>S.tasks?.length},
  {id:"entity",   label:"entity"},
  {id:"schedule", label:"schedule", count:()=>S.schedules?.length},
  {id:"io",       label:"io",       count:()=>S.ios?.length},
  {id:"runner",   label:"runner",   count:()=>S.runners?.length},
  {id:"resolver", label:"resolver", count:()=>S.resolvers?.length},
];

/* WHAT EACH VIEW NEEDS, and nothing else. This used to read all nine routes on every
   refresh — on a 15s floor and again on every watch event — whichever tab was open. Against
   staging that is 857KB a pass, because `/tasks` alone is 785KB over 81 entries: a task
   carries its prompt and its whole `result`, and an LLM task's result is kilobytes of JSON.
   So the page dragged three quarters of a megabyte across the network, and js-yaml parsed it,
   to render a tab that was not showing any of it.

   `/status`, `/gates` and `/flows` are always read — about 2KB together, and they are what the
   masthead, the docket badge and the subject rail are. Everything else is read when its own
   view is on screen. */
const NEEDS = {
  task:     ["tasks","/tasks"],
  charter:  ["charter","/charter"],
  schedule: ["schedules","/schedules"],
  io:       ["ios","/io"],
  runner:   ["runners","/runners"],
  resolver: ["resolvers","/resolvers"],
};
async function poll(){
  try{
    const [st,gates,flows] = await Promise.all([
      get("/status"), get("/gates"), get("/flows")]);
    S.status = st; S.gates = gates||[]; S.flows = flows||[];
    ONLINE = true; ERR = "";
  }catch(e){ ONLINE = false; ERR = e.message; render(); return; }

  // A view's own read, on its own, so a route that fails costs its tab and nothing else.
  const need = NEEDS[S.view];
  if (need){
    const [key,route] = need;
    try{ S[key] = (await get(route)) || []; delete S.errs[key]; }
    catch(e){ S.errs[key] = e.message; }
  }
  if (S.view === "flow" && S.subject) await loadTree(S.subject);
  if (S.view === "entity") await loadEntity(S.entityAt);
  render();
}
/* ── watching ────────────────────────────────────────────
   THE STREAM SAYS WHEN; THE ROUTES SAY WHAT. A frame carries the changed document, but what
   this page shows — which gates are still pending, which tasks are in flight — is a derived
   view, and rebuilding those here would be a second copy of the server's own reading, wrong
   the first time either changed. So an event is a doorbell: re-read the summaries.

   PER-SUBTREE, AND NO ROOT WATCH, which is the engine's own rule. A watch at the root
   delivers the whole verse on every commit (docs/convergence.md measures what that costs as
   the store fills), and this page cares about three places. Each stream names its own.

   `wait-if-absent`, because on a verse where nothing has happened yet these paths hold
   nothing, and the default answer to a watch on an empty path is a refusal. */
const WATCHES = [
  {at:"verse.gate.question", open:false},
  {at:"verse.task.instance", open:false},
  {at:"verse.trigger.rule",  open:false},
];
let refreshSoon = null;
function watch(){
  // `?watch=off` falls back to polling alone. A headless browser advances its virtual clock
  // only when no request is outstanding, and a watch is outstanding for ever — so a
  // screenshot or a DOM dump of this page hangs until the stream is the thing turned off.
  if (new URLSearchParams(location.search).get("watch") === "off") return;
  for (const wd of WATCHES){
    const es = new EventSource(`/v/watch?at=${encodeURIComponent(wd.at)}&wait-if-absent=true`);
    es.onopen    = ()=>{ wd.open=true; renderHead(); };
    es.onmessage = ()=>{ // debounced: a firing writes several times in a burst
      clearTimeout(refreshSoon); refreshSoon=setTimeout(poll, 250); };
    es.onerror   = ()=>{ wd.open=false; renderHead(); }; // EventSource reconnects on its own
    wd.es = es;
  }
}
const streaming = () => WATCHES.filter(w=>w.open).length;

async function loadTree(subject){
  try{ S.tree = await get("/flow/tree?subject="+encodeURIComponent(subject)); }
  catch(e){ S.tree = null; }
}
async function loadEntity(at){
  try{ S.entity = await get("/state"+(at?"?at="+encodeURIComponent(at):"")); }
  catch(e){ S.entity = null; }
}

/* ── shell ───────────────────────────────────────────────── */
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t=>{
    const n = t.count ? t.count() : null;
    return `<button class="tab" role="tab" data-v="${t.id}" aria-selected="${S.view===t.id}">${t.label}${
      n!==null&&n!==undefined?`<span class="n">${n}</span>`:""}</button>`;
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    S.view=b.dataset.v; S.sel=null;
    if (S.view==="flow" && !S.subject && S.flows.length) S.subject = S.flows[0].subject;
    // The view is in the fragment, so a console tab is a link somebody can send.
    try{ history.replaceState(null,"","#"+S.view); }catch(e){}
    render(true); poll();
  });
}
function renderHead(){
  const n = streaming();
  $("#led").className = "led"+(ONLINE?" ok":"");
  $("#conn").innerHTML = ONLINE
    ? `${esc(ADDR)} <span style="color:var(--faint)">· ${n===WATCHES.length?"watching":n?`watching ${n}/${WATCHES.length}`:"polling"}</span>`
    : "offline";
  const st = S.status||{};
  $("#c-gate").textContent = S.gates.length;
  $("#c-task").textContent = st.flows?.tasks ?? 0;
  $("#c-rule").textContent = st.charter?.rules ?? "·";
  $("#c-rev").textContent = st.storeRev ?? "·";
  $("#foot").innerHTML = ONLINE
    ? `verse <span class="mono">${esc(ADDR)}</span> · fired <span class="mono">${esc(st.fired??0)}</span>
       · strata <span class="mono">${esc(st.charter?.strata??0)}</span>
       · runner <span class="mono">${esc(st.runner?.kind??"?")}</span>
       · writing as <span class="mono">${esc(PRINCIPAL||"nobody — writes will be refused")}</span>`
    : `cannot reach verse: ${esc(ERR)}`;
}

/* ── gate (the docket) ───────────────────────────────────── */
function viewGate(){
  if (!S.gates.length) return `<div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">Nothing is waiting on a person</h2>
    <p class="headp">Every gate has settled, or every action is running under a gate set to auto.
    A gate is <span class="mono">auto</span>, <span class="mono">ask</span> or <span class="mono">park</span> —
    the autonomy dial, per action.</p></div></div></div>`;
  const g = S.sel?.t==="gate" ? S.gates.find(x=>x.id===S.sel.id) : null;
  return `<div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">Questions waiting on a person</h2>
    <p class="headp">Every gate this verse is holding. <span class="mono">where</span> says whether the
    engine or a task raised it; <span class="mono">spawns</span> names the work a yes will start,
    settled before that work exists.</p>
    ${S.gates.map(x=>gateCard(x)).join("")}
  </div></div></div>
  <aside class="insp">${g?gateInsp(g):`<div class="empty">Select a gate.</div>`}</aside>`;
}
function gateCard(g){
  const opts = g.options||[];
  return `<button class="card gate" data-gate="${esc(g.id)}">
    <div class="q">${esc(g.reason || g.pose || g.gate)}</div>
    <div class="meta">${esc(g.id)}<br>
      gate <b>${esc(g.gate)}</b> · mode ${esc(g.mode)} · where ${esc(g.where||"?")} ·
      subject ${esc(g.subject||"—")}<br>
      waitingOn ${esc((g.waitingOn||[]).join(", ")||"the docket")}
      ${opts.length?` · options ${esc(opts.map(o=>o.id+"("+(o.need??1)+")").join(" "))}`:""}
    </div>
  </button>`;
}
function gateInsp(g){
  const opts = g.options||[];
  return `<div class="body">
    <h3 class="lbl" style="padding:0">gate · ${esc(g.mode)}</h3>
    <div class="hd">${esc(g.id)}</div>
    <div class="sub">raised by the ${esc(g.where||"engine")} — waiting on a person</div>
    <div class="pose">${esc(g.reason||g.pose||"")}</div>
    ${opts.length?`<div class="sect"><h4>options</h4>${opts.map(o=>`
      <div class="opt"><span class="ballots">${Array.from({length:o.need??1},()=>`<i></i>`).join("")}</span>
        <span class="oid">${esc(o.id)}</span><span class="need">need ${esc(o.need??1)}</span></div>`).join("")}
    </div>`:""}
    <dl class="f">${fields(g,["id","reason","pose","options","spawns"])}</dl>
    ${g.spawns?`<div class="sect"><h4>a yes starts</h4>
      ${String(g.spawns).split(/[,\s]+/).filter(Boolean).map(s=>`<div class="spawn">${esc(s)}</div>`).join("")}
      <p class="note">The id is derived from the rule and the subject, so it is settled before the
      work exists — which is what lets a question name the work it authorises.</p></div>`:""}
    <div id="gate-err"></div>
    <div class="acts">
      <button class="btn ok" data-do="proceed" ${PRINCIPAL?"":"disabled"}>approve</button>
      <button class="btn no" data-do="deny" ${PRINCIPAL?"":"disabled"}>deny</button>
      <button class="btn sm" data-do="say" ${PRINCIPAL?"":"disabled"}>say</button>
      <button class="btn sm" data-do="escalate" ${PRINCIPAL?"":"disabled"}>escalate</button>
    </div>
    <p class="note">${PRINCIPAL
      ? `Answering writes a ballot attributed to <span class="mono">${esc(PRINCIPAL)}</span>. A resolution is an act, and an act has an actor.`
      : `No principal. Restart the console with <span class="mono">-as user:you@example.com</span> — verse refuses an unattributable answer.`}</p>
  </div>`;
}
const row = (k,v) => v===undefined||v===null||v===""?"":`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`;
// Every field the route returned, minus the ones already shown above. A route that grows a
// field shows it here without this page being touched — which is the whole reason the proxy
// hands the response through unchanged.
const fields = (o,skip=[]) => Object.keys(o||{}).sort()
  .filter(k=>!skip.includes(k))
  .map(k=>row(k, Array.isArray(o[k]) ? o[k].join(", ")
                : typeof o[k]==="object" ? JSON.stringify(o[k]) : o[k])).join("");

async function act(g, what){
  const box = $("#gate-err"); if (box) box.innerHTML = "";
  try{
    if (what==="proceed"||what==="deny"){
      const say = prompt(`say something with the ${what} (optional)`) ?? "";
      await post("/gate/resolve", {id:g.id, choice:what, by:PRINCIPAL,
        ...(say?{say:[say]}:{})});
    } else if (what==="say"){
      const say = prompt("say something about this question, without answering it");
      if (!say) return;
      await post("/gate/say", {id:g.id, by:PRINCIPAL, say});
    } else if (what==="escalate"){
      const say = prompt("hand it to the next rung — why?") ?? "";
      await post("/gate/escalate", {id:g.id, by:PRINCIPAL, say});
    }
    S.sel = null; await poll();
  }catch(e){
    const b = $("#gate-err"); if (b) b.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ── flow (the canvas) ───────────────────────────────────── */
const NW=176,NH=60,GX=120,GY=26,PAD=6;
function provOf(status){
  if (status==="running") return "registry";
  if (status==="pending") return "charter";
  return "mirror";
}
function layout(tree){
  const nodes=[], edges=[]; let lane=0;
  const walk=(n,depth,parent)=>{
    const me={chain:n.chain,id:n.id,kind:n.kind,status:n.status,prompt:n.prompt,
              lastAction:n.lastAction,result:n.result,depth,lane:lane};
    nodes.push(me);
    if(parent) edges.push({from:parent,to:me});
    const kids=n.children||[];
    kids.forEach((k,i)=>{ if(i>0) lane++; walk(k,depth+1,me); });
    if(!kids.length) return;
  };
  (tree.roots||[]).forEach((r,i)=>{ if(i>0) lane++; walk(r,0,null); });
  return {nodes,edges};
}
function viewFlow(){
  if (!S.flows.length) return `<aside class="rail"><h3 class="lbl">subject</h3>
    <div class="empty" style="padding:20px 16px;text-align:left">No live work.<br><br>
    A flow is a subject's tasks in flight — it exists while something runs.</div></aside>
    <div class="main grid"><div class="pad"><div class="wrap">
    <h2 class="head">No subject has live work</h2>
    <p class="headp">A flow is not stored. It is assembled per request from the charter (what may yet
    happen), the mirror (what already did) and the live registry (what is running) — so with nothing
    running there is nothing to assemble.</p></div></div></div>`;

  const subs = [...new Set(S.flows.map(f=>f.subject))];
  if (!S.subject || !subs.includes(S.subject)) S.subject = subs[0];
  const rail = `<aside class="rail">
    <h3 class="lbl">subject</h3>
    ${subs.map(s=>{
      const rows=S.flows.filter(f=>f.subject===s);
      return `<button class="row" data-subj="${esc(s)}" aria-current="${s===S.subject}">
        <span class="a">${esc(s)}</span>
        <span class="b"><i class="dot live"></i>${rows.length} in flight · ${esc(rows[0].charter||"")}</span>
      </button>`;}).join("")}
    <div class="legend"><h3 class="lbl" style="padding:0;margin-bottom:9px">provenance</h3>
      <div class="lg"><span class="sw registry"></span><span><b>registry</b>running now</span></div>
      <div class="lg"><span class="sw mirror"></span><span><b>mirror</b>already happened</span></div>
      <div class="lg"><span class="sw charter"></span><span><b>charter</b>may yet happen</span></div>
    </div></aside>`;

  const t = (S.tree||[]).find(x=>x.subject===S.subject) || (S.tree||[])[0];
  if (!t) return rail+`<div class="main grid"><div class="empty">Loading the tree…</div></div>`;
  const {nodes,edges} = layout(t);
  const maxD=Math.max(...nodes.map(n=>n.depth)), maxL=Math.max(...nodes.map(n=>n.lane));
  const W=PAD+maxD*(NW+GX)+NW+PAD, H=PAD+maxL*(NH+GY)+NH+PAD;
  const X=d=>PAD+d*(NW+GX), Y=l=>PAD+l*(NH+GY);

  let paths=`<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--rule)"/></marker>
    <marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker></defs>`;
  for(const e of edges){
    const x1=X(e.from.depth)+NW,y1=Y(e.from.lane)+NH/2,x2=X(e.to.depth),y2=Y(e.to.lane)+NH/2;
    const gh = provOf(e.to.status)==="charter", mid=x1+GX/2;
    paths+=`<path d="M${x1},${y1} H${mid} V${y2} H${x2}" fill="none"
      stroke="${gh?"var(--accent)":"var(--rule)"}" stroke-width="1.5"
      ${gh?'stroke-dasharray="5 4" opacity=".7"':""} marker-end="url(#${gh?"arg":"ar"})"/>`;
  }
  const cards = nodes.map(n=>{
    const prov=provOf(n.status), bad=n.status==="failed"||n.status==="cancelled";
    const pressed = S.sel?.t==="node" && S.sel.id===(n.id||n.chain);
    return `<button class="node ${prov}${bad?" bad":""}" data-node="${esc(n.id||n.chain)}"
      aria-pressed="${pressed}" style="left:${X(n.depth)}px;top:${Y(n.lane)}px;width:${NW}px;min-height:${NH}px">
      <span class="k">${esc(n.kind||"task")}</span>
      <span class="c">${esc(n.chain)}</span>
      <span class="m">${n.status==="running"?'<i class="pulse"></i>':""}${esc(n.lastAction||n.status||"")}</span>
    </button>`;}).join("");

  const selNode = S.sel?.t==="node" ? nodes.find(n=>(n.id||n.chain)===S.sel.id) : null;
  return rail + `<div class="main grid">
    <div class="chead"><span class="t">${esc(t.subject)}</span>
      <span class="chip">${t.active?"active":"idle"}</span>
      <span class="chip">${nodes.length} node${nodes.length===1?"":"s"}</span></div>
    <div class="stage" style="width:${W}px;height:${H}px">
      <svg class="edges" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${paths}</svg>
      ${cards}
    </div></div>
    <aside class="insp">${selNode?nodeInsp(selNode,t):`<div class="empty">Select a node.<br><br>
      Dashed is the <b>charter</b>: a hook that has not fired, so no entity stands behind it yet.</div>`}</aside>`;
}
function nodeInsp(n,t){
  const prov=provOf(n.status);
  const full = (S.tasks||[]).find(x=>x.id===n.id);
  return `<div class="body">
    <h3 class="lbl" style="padding:0">${esc(n.kind||"task")}</h3>
    <div class="hd">${esc(n.id||n.chain)}</div>
    <div class="sub">${({registry:"live registry — running now",
      mirror:"mirror — already happened",charter:"charter — may yet happen"})[prov]}</div>
    ${n.prompt?`<div class="pose mono" style="font-size:11.5px">${esc(n.prompt)}</div>`:""}
    <dl class="f">
      ${row("chain",n.chain)}${row("status",n.status)}${row("kind",n.kind)}
      ${row("lastAction",n.lastAction)}${row("subject",t.subject)}
      ${full?row("driver",full.driver)+row("runner",full.runner)+row("cursor",full.cursor)
             +row("occurrence",full.occurrence)+row("started",full.started):""}
    </dl>
    ${n.result?`<div class="sect"><h4>result</h4>
      <div style="font-size:12px;line-height:1.5">${esc(n.result)}</div></div>`:""}
    ${prov==="charter"?`<div class="sect"><h4>not yet real</h4>
      <p class="note">A hook fires when the action's spawn reaches its terminal status. Nothing is
      spawned until then, so this chain has no task and no entity.</p></div>`:""}
    ${n.status==="running"?`<div id="flow-err"></div><div class="acts">
      <button class="btn sm" data-flow="say" ${PRINCIPAL?"":"disabled"}>say</button>
      <button class="btn sm" data-flow="suspend" ${PRINCIPAL?"":"disabled"}>suspend</button>
      <button class="btn sm" data-flow="resume" ${PRINCIPAL?"":"disabled"}>resume</button>
      <button class="btn sm no" data-flow="cancel" ${PRINCIPAL?"":"disabled"}>cancel</button></div>
      <p class="note">Steering is out-of-band and serviced ahead of observation — an intervention that
      queued behind a backlog would be an intervention defeated.</p>`:""}
  </div>`;
}
async function flowAct(taskId, what){
  const box=$("#flow-err"); if(box) box.innerHTML="";
  try{
    if(what==="say"){
      const text=prompt("say to this run"); if(!text) return;
      await post("/flow/say",{task:taskId,text,by:PRINCIPAL});
    } else if(what==="suspend"){
      const why=prompt("why suspend it?")||"from the console";
      await post("/flow/suspend",{task:taskId,why,by:PRINCIPAL});
    } else if(what==="resume"){
      await post("/flow/resume",{task:taskId,by:PRINCIPAL});
    } else if(what==="cancel"){
      if(!confirm("cancel this run? it ends the task.")) return;
      await post("/flow/cancel",{task:taskId,by:PRINCIPAL});
    }
    await poll();
  }catch(e){ const b=$("#flow-err"); if(b) b.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

/* ── charter ─────────────────────────────────────────────── */
function viewCharter(){
  const c=S.charter;
  if(!c) return `<div class="main"><div class="empty">Loading the charter…</div></div>`;
  const rules=c.rules||[];
  const sel = S.sel?.t==="rule" ? rules.find(r=>r.name===S.sel.id) : null;
  return `<aside class="rail"><h3 class="lbl">rule</h3>
    ${rules.map(r=>`<button class="row" data-rule="${esc(r.name)}" aria-current="${sel?.name===r.name}">
      <span class="a">${esc(r.name)}</span>
      <span class="b">${esc(r.stratum||"—")} · ${r.gates?.length?`${r.gates.length} gate`:"no gate"}</span>
    </button>`).join("")}</aside>
  <div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">charter</h2>
    <p class="headp">The installed rules, read back from the verse. A rule is an
    event–condition–action: when the condition holds and the gates resolve, the action fires.
    <span class="mono">writes: ${esc(c.writes||"—")}</span></p>
    ${sel?`<pre class="tony">${esc(jsyaml.dump(sel,{lineWidth:78,noRefs:true}))}</pre>`
         :`<pre class="tony">${esc(jsyaml.dump({rules:rules.map(r=>r.name)},{lineWidth:78}))}</pre>`}
  </div></div></div>`;
}

/* ── task / entity / registries ──────────────────────────── */
function viewTask(){
  if(S.errs.tasks) return listView("task","",[],S.errs.tasks);
  if(!S.tasks) return `<div class="main"><div class="empty">Reading the tasks…</div></div>`;
  if(!S.tasks.length) return blank("task","No task is running.",
    "A task is a governed unit of agentic work, hosted by a runtime, observable and steerable. Tasks are entities, so the fleet is visible by watching the store.");
  return `<div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">task</h2><p class="headp">Every task, whatever runs it.</p>
    ${S.tasks.map(t=>`<div class="card" style="padding:13px 15px">
      <div class="q mono" style="font-size:12px">${esc(t.id)}</div>
      <dl class="kv" style="margin-top:8px">
        ${row("status",t.status)}${row("driver",t.driver)}${row("runner",t.runner)}
        ${row("cursor",t.cursor)}${row("occurrence",t.occurrence)}${row("started",t.started)}
        ${row("prompt",t.prompt)}</dl></div>`).join("")}
  </div></div></div>`;
}
function viewEntity(){
  return `<div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">entity</h2>
    <p class="headp">The store, read as one document at a kinded path. Everything is addressed by
    path — <span class="mono">demo.pr.1</span> is an entity, <span class="mono">demo.pr.1.stage</span>
    is a field of one, and nothing says which: entity-hood is a lens, not a stored fact.</p>
    <div style="display:flex;gap:7px;margin-bottom:13px">
      <input id="at" value="${esc(S.entityAt)}" placeholder="a kinded path, e.g. demo.pr"
        style="flex:1;padding:7px 10px;border:1px solid var(--rule);border-radius:2px;
        background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:12px">
      <button class="btn sm" id="go-at">read</button></div>
    <pre class="tony">${esc(S.entity===null?"(nothing there)":jsyaml.dump(S.entity,{lineWidth:78,noRefs:true}))}</pre>
  </div></div></div>`;
}
function listView(title, blurb, rows, err){
  // A READ THAT FAILED IS NOT AN EMPTY LIST. Saying "no schedule is installed" about a verse
  // this page could not reach is a claim it has no evidence for, and it reads exactly like the
  // true answer — which is the worst way for a console to be wrong.
  if(err) return `<div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">Could not read the ${esc(title)}</h2>
    <div class="err">${esc(err)}</div>
    <p class="note">This tab alone failed; the others are unaffected.</p></div></div></div>`;
  if(!rows) return `<div class="main"><div class="empty">Reading the ${esc(title)}…</div></div>`;
  if(!rows.length) return blank(title, `No ${title} is installed.`, blurb);
  return `<div class="main"><div class="pad"><div class="wrap">
    <h2 class="head">${esc(title)}</h2><p class="headp">${blurb}</p>
    ${rows.map(r=>`<div class="card" style="padding:12px 15px">
      <dl class="kv">${Object.entries(r).map(([k,v])=>row(k,typeof v==="object"?JSON.stringify(v):v)).join("")}</dl>
    </div>`).join("")}</div></div></div>`;
}
function blank(t,h,p){ return `<div class="main"><div class="pad"><div class="wrap">
  <h2 class="head">${esc(h)}</h2><p class="headp">${p}</p></div></div></div>`; }

/* ── render ──────────────────────────────────────────────── */
let lastSig="";
function render(force){
  // A FULL innerHTML REBUILD IS NOT FREE, and it throws away scroll position and any text the
  // reader had selected. storeRev moves on every commit, so it stands in for "the verse
  // changed" without stringifying a payload to find out.
  const sig = JSON.stringify([S.view,S.sel,ONLINE,ERR,S.status?.storeRev,S.subject,S.entityAt,
    S.gates.length,S.flows.length,S.tasks?.length,S.charter?.rules?.length,
    S.schedules?.length,S.ios?.length,S.runners?.length,S.resolvers?.length,S.errs]);
  if(!force && sig===lastSig) return;
  lastSig = sig;
  renderTabs(); renderHead();
  const v=$("#views");
  v.className="work";
  if(!ONLINE){
    v.innerHTML=`<div class="main"><div class="pad"><div class="wrap">
      <h2 class="head">Cannot reach the verse</h2>
      <div class="err">${esc(ERR||"no answer")}</div>
      <p class="headp">Nothing below can be trusted while this stands, so nothing is shown:
      an empty tab here would mean "this page could not ask", not "there is none".
      Check the console is still running and still pointed where you think it is.</p>
      </div></div></div>`;
    return;
  }
  switch(S.view){
    case "gate": v.innerHTML=viewGate(); break;
    case "flow": v.innerHTML=viewFlow(); break;
    case "charter": v.innerHTML=viewCharter(); break;
    case "task": v.innerHTML=viewTask(); break;
    case "entity": v.innerHTML=viewEntity(); break;
    case "schedule": v.innerHTML=listView("schedule",
      "The schedules this verse ticks on. Time is a cause only when it is written down: a tick is an entity at <span class='mono'>verse.schedule.&lt;name&gt;.tick.&lt;instant&gt;</span>.",S.schedules,S.errs.schedules); break;
    case "io": v.innerHTML=listView("io",
      "What reflects an external system in, and says things back out. An io is a program you deploy and install.",S.ios,S.errs.ios); break;
    case "runner": v.innerHTML=listView("runner",
      "Where work can run: local, a remote verse, or a dial-in broker. The engine drives all three through one handle.",S.runners,S.errs.runners); break;
    case "resolver": v.innerHTML=listView("resolver",
      "Who answers a gate. A binding is installed rather than written into a charter, because it outlives any one rule.",S.resolvers,S.errs.resolvers); break;
  }
  // wiring
  v.querySelectorAll("[data-gate]").forEach(b=>b.onclick=()=>{S.sel={t:"gate",id:b.dataset.gate};render();});
  v.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{S.sel={t:"node",id:b.dataset.node};render();});
  v.querySelectorAll("[data-rule]").forEach(b=>b.onclick=()=>{S.sel={t:"rule",id:b.dataset.rule};render();});
  v.querySelectorAll("[data-subj]").forEach(b=>b.onclick=async()=>{
    S.subject=b.dataset.subj; S.sel=null; await loadTree(S.subject); render();});
  v.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>{
    const g=S.gates.find(x=>x.id===S.sel?.id); if(g) act(g,b.dataset.do);});
  v.querySelectorAll("[data-flow]").forEach(b=>b.onclick=()=>{
    if(S.sel?.id) flowAct(S.sel.id,b.dataset.flow);});
  const go=$("#go-at"); if(go) go.onclick=async()=>{
    S.entityAt=$("#at").value.trim(); await loadEntity(S.entityAt); render();};
}
$("#theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.getAttribute("data-theme")==="dark"||
    (!r.hasAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
};

(async ()=>{
  const want=location.hash.replace(/^#/,"");
  if (TABS.some(t=>t.id===want)) S.view=want;
  try{ const t=await (await fetch("/who")).text();
       const [p,a]=t.split("\n"); PRINCIPAL=p.trim(); ADDR=a.trim(); }catch(e){}
  if (S.view==="flow"){ // the rail needs the flows before the tree can be asked for
    try{ S.flows=await get("/flows")||[]; if(S.flows.length) S.subject=S.flows[0].subject; }catch(e){}
  }
  await poll();
  watch();
  // A floor under the streams rather than the way state arrives: a dropped stream that never
  // reconnects, or a change somewhere none of the three watches names, still lands within this.
  setInterval(poll, 15000);
})();
</script>
</body>
</html>
