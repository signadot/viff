site_name: Verse
# The repository, linked with its icon from the header of every page, as tony-format's site
# does. edit_uri is empty so the link is to the repository rather than a per-page "Edit on
# GitHub".
repo_url: https://github.com/signadot/verse
repo_name: GitHub
edit_uri: ""

# The site is what verse does. roadmap/ and working/ are design notes for work that is not
# built, read in the repository, so the site does not publish them at all: a published page
# that points at one links to it on GitHub, and `make check-docs` fails on a relative link
# into either, because that link would 404 here.
exclude_docs: |
  /roadmap/
  /working/

# The nav follows docs/README.md's four kinds rather than the directory layout: a welcome,
# the walks a person drives, the architecture by subject, and the reference. Where the two
# disagree, the index wins and this follows it.
nav:
- Welcome:
  - Welcome: README.md
  - Overview: overview.md
- Walks:
  - tutorial.md
  - perms-guide.md
  - auto-supervisor.md
- Architecture:
  - seams.md
  - Entities and the store:
    - change-events.md
    - perms.md
  - Charters and triggers:
    - convergence.md
    - cycle-throttle.md
    - strata.md
    - provider-selection.md
  - Tasks and autonomy:
    - task-control.md
    - attached-resolvers.md
    - runners.md
    - external-tasks.md
  - Steering:
    - control.md
    - deployment-and-steering.md
  - Federation:
    - sources.md
    - content-federation.md
    - controllers.md
- Reference:
  - reference/README.md
  - trigger-model.md
  - reference/up.md
  - reference/entities.md
  - reference/store.md
  - reference/tasks.md
  - reference/runners.md
  - reference/resolvers.md
  - reference/sources.md
  - reference/sourced.md
  - reference/connect.md
  - reference/representation.md
  - reference/examples/README.md

theme:
  name: mkdocs
  highlightjs: false

markdown_extensions:
  - tables: {}
  # GitHub's slug algorithm, not python-markdown's default. This is the one deviation from
  # tony-format's config, and it is not cosmetic: these docs are read on GitHub as much as on
  # the site, so every intra-page link in the tree is already written GitHub-style. The two
  # differ wherever a heading contains punctuation that is stripped — `## 4. Charters —
  # relating entities to tasks` is `#4-charters--relating-entities-to-tasks` on GitHub
  # and `#4-charters-relating-entities-to-tasks` under the default, because the default
  # collapses the run of separators the stripped em-dash leaves behind. Setting it here fixes
  # every such link at once and keeps one spelling correct in both places, which editing the
  # links to suit the site would not.
  - toc:
      permalink: '#'
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  # Use pymdownx.highlight - works better with superfences than codehilite
  - pymdownx.highlight:
      use_pygments: true
      css_class: codehilite
      anchor_linenums: true
  - pymdownx.superfences:
      # Custom fence for mermaid diagrams only
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
      # Explicitly tell superfences to use pymdownx.highlight for other languages
      # This ensures tony code blocks get pygments highlighting

extra_css:
  - pygments.css
plugins:
  - mermaid2
