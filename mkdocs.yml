site_name: Verse
# The repository, linked with its icon from the header of every page, as tony-format's site
# does. edit_uri is empty so the link is to the repository rather than a per-page "Edit on
# GitHub".
repo_url: https://github.com/signadot/verse
repo_name: GitHub
edit_uri: ""

# The site is for somebody who USES verse: writes charters, runs tasks, answers gates. The pages
# for running a verse, extending it and changing it stay in the repository, where a person and an
# agent read them, and the site does not publish them (docs/platform.md indexes them). Nor does
# it publish articles/, prose written for somewhere else.
#
# A published page links to an excluded one relatively, as a reader of the repository needs, and
# the hook rewrites that link to the file on GitHub when the site is built.
exclude_docs: |
  /articles/
  /design/
  /platform/
  /platform.md
  /seams.md
  /task-control.md
  /attached-resolvers.md
  /io.md
  /runners.md
  /change-events.md
  /cycle-throttle.md
  /external-tasks.md
  /deployment-and-steering.md
  /content-federation.md
  /controllers.md
  /reference/up.md
  /reference/runners.md
  /reference/resolvers.md
  /reference/io.md
  /reference/iod.md
  /reference/store.md
  /reference/examples/

hooks:
  - scripts/mkdocs_repo_links.py

# The nav follows docs/README.md's groups. Where the two disagree, the index wins and this
# follows it. A page is listed once.
#
# The nav is one level deep under each heading. The mkdocs theme draws a nested section as
# a submenu it positions with script and `position: fixed`, and that submenu does not open
# reliably, so each group lists its pages in reading order rather than grouping them again.
nav:
- Start here:
  - Welcome: README.md
  - Overview: overview.md
  - tutorial.md
  - Control: control.md
  - build.md
  - glossary.md
- Use verse:
  - reference/README.md
  - reference/tasks.md
  - asking.md
  - perms-guide.md
  - reference/connect.md
- Write a charter:
  - Introduction: charter-intro.md
  - trigger-model.md
  - reference/condition.md
  - reference/action.md
  - reference/gates.md
  - reference/charter.md
  - reference/schedules.md
  - reference/entities.md
  - strata.md
  - convergence.md
  - provider-selection.md
  - perms.md
  - reference/perms.md
  - auto-supervisor.md
  - reference/representation.md

theme:
  name: mkdocs
  highlightjs: false

markdown_extensions:
  - tables: {}
  # GitHub's slug algorithm, not python-markdown's default. This is the one deviation from
  # tony-format's config, and it is not cosmetic: these docs are read on GitHub as much as on
  # the site, so every intra-page link in the tree is already written GitHub-style. The two
  # differ wherever a heading contains punctuation that is stripped — `## 4. Charters —
  # relating entities to tasks` is `#4-charters--relating-entities-to-tasks` on GitHub
  # and `#4-charters-relating-entities-to-tasks` under the default, because the default
  # collapses the run of separators the stripped em-dash leaves behind. Setting it here fixes
  # every such link at once and keeps one spelling correct in both places, which editing the
  # links to suit the site would not.
  - toc:
      permalink: '#'
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  # Use pymdownx.highlight - works better with superfences than codehilite
  - pymdownx.highlight:
      use_pygments: true
      css_class: codehilite
      anchor_linenums: true
  - pymdownx.superfences:
      # Custom fence for mermaid diagrams only
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
      # Explicitly tell superfences to use pymdownx.highlight for other languages
      # This ensures tony code blocks get pygments highlighting

extra_css:
  - pygments.css
plugins:
  - mermaid2
