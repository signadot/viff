# The GitHub Source: `iod github`, holding a token.
#
# The credential first, as with Slack and Linear:
#
#   kubectl -n verse create secret generic verse-github \
#     --from-literal=GITHUB_TOKEN=github_pat_… \
#     --from-literal=GITHUB_WEBHOOK_SECRET=…
#
# GITHUB_TOKEN is a fine-grained personal access token with read access to the repositories'
# metadata, issues, pull requests and Actions. A GitHub App is what an org-scale install wants,
# and a measurement says when: a personal token covers about
# forty repositories with discussions on, and effectively unbounded with `-discussions=false`.
#
# Install it once the pods are up (the name must match `githubIOName`, because the hint url
# below carries it):
#   verse io add repos http://github-io:9801 -root github
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-io
  labels:
    app: verse
    tier: io
    io: github
spec:
  replicas: 1
  # Recreate: one writer of github.*, for the reason the git source is one. Two of these may
  # stand side by side, but only over disjoint repositories — or under roots of their own, which
  # is what `-root` is for.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verse
      tier: io
      io: github
  template:
    metadata:
      labels:
        app: verse
        tier: io
        io: github
    spec:
      containers:
      - name: github-io
        image: signadot/verse:latest
        command:
        - iod
        - github
        - -addr
        - :9801
        # Shorter than Linear's, because every REST read here is conditional and a 304 does not
        # count against the rate limit: a repository where nothing happened costs nothing. What
        # a warm pass does spend is discussions, which are GraphQL and carry no ETag — two
        # requests per repository per pass, which is what sets how many repositories one token
        # covers. `-discussions=false` takes it to zero.
        - -min-interval
        - "1m"
        ports:
        - name: source
          containerPort: 9801
        # pprof and goroutine stacks, one port up from -addr (adminface). A source that has
        # stopped answering logs nothing, and this is what says where it is blocked.
        - name: admin
          containerPort: 9802
        env:
        - name: VERSE_HINT_URL
          value: http://verse:9797/io/repos/hint
        envFrom:
        - secretRef:
            name: verse-github
        readinessProbe:
          httpGet:
            path: /io
            port: source
          initialDelaySeconds: 3
          periodSeconds: 10
          # Explicit, for the reason versed's are: the default is one second, and /source is
          # answered by a program that may be busy talking to somebody else's API.
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: github-io
  labels:
    app: verse
    tier: io
    io: github
spec:
  selector:
    app: verse
    tier: io
    io: github
  ports:
  - name: source
    port: 9801
    targetPort: source
---
# GitHub's webhook needs a url IT can reach — the same asymmetry the Slack and Linear ingresses
# carry, and the same consequence without it: the source converges one resync behind instead of
# in seconds. Dropped unless `githubWebhookHost` is set. Point the repository's Settings →
# Webhooks at https://<host>/github/webhook, content type application/json.
#
# Without one, nothing is lost but latency — which is why this is the last thing to arrange
# rather than the first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-io
  labels:
    app: verse
    tier: io
    io: github
spec:
  rules:
  - host: github-io.example.com
    http:
      paths:
      - path: /github/webhook
        pathType: Prefix
        backend:
          service:
            name: github-io
            port:
              number: 9801
