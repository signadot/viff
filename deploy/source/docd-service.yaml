# docd's client face: where store clients read and write entities, scoped (copy-on-write)
# writes included. The address versed is pointed at, and the one to be deliberate about in a
# tailnet ACL — it is the whole store, read/write.
#
# Two Services over one pod, this face plus the StatefulSet's governing one, rather than one
# Service with every port: a face is what an ACL grants, and the Tailscale operator gives a
# Service one tailnet IP. See docd-headless-service.yaml for the other.
apiVersion: v1
kind: Service
metadata:
  name: docd
  labels:
    app: verse
    tier: docd
spec:
  selector:
    app: verse
    tier: docd
  ports:
  - name: client
    port: 7071
    targetPort: client
