apiVersion: v1
kind: Service
metadata:
  name: verse-broker
  labels:
    app: verse
    # `tier`, so this face ships with the versed that serves it (see `make ship-versed`).
    tier: versed
spec:
  selector:
    app: verse
    tier: versed
  ports:
  - name: broker
    port: 9090
    targetPort: broker
