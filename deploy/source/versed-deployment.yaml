apiVersion: apps/v1
kind: Deployment
metadata:
  name: versed
  labels:
    app: verse
    tier: versed
spec:
  replicas: 1
  # Singleton engine (two would double-fire triggers), and no storage — so Recreate, not
  # RollingUpdate, avoids two versed overlapping during a rollout. Leader-election is the
  # scale-out answer later. Stateless client of docd, so it floats (any node/AZ).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verse
      tier: versed
  template:
    metadata:
      labels:
        app: verse
        tier: versed
    spec:
      containers:
      - name: versed
        image: signadot/verse:latest
        # Attach to the docd tier — spawns nothing locally, holds no durable state.
        args:
        - up
        - --docd-addr
        - docd:7071
        - --addr
        - :9797
        ports:
        - name: api
          containerPort: 9797
        # The admin/pprof face, DERIVED from --addr (adminface): whatever versed serves on,
        # this is one port up. Declared rather than passed as a flag because the deployment
        # patches args as a list (deploy/build.tony) and a knob that a profile silently drops
        # is worse than none. `kubectl port-forward deploy/versed 9798` then
        # /debug/pprof/goroutine?debug=2 is what to reach for when versed stops answering —
        # it holds no lock a request handler wants, so it answers when /status cannot.
        - name: admin
          containerPort: 9798
        # LLM creds, if you run agents on the `llm` driver. Optional: verse runs on the
        # credential-free `scripted` driver without it.
        envFrom:
        - secretRef:
            name: verse-llm
            optional: true
        # Both probes read /status, and both carry an explicit timeoutSeconds because the
        # default is ONE SECOND and /status is not a constant-time read — it reports store
        # revision and engine counts, so it answers as fast as docd does. Measured on a k3s
        # deployment holding ~500 reflected entities: ~2s, which the default calls a failure.
        # /healthz, not /status. /status is a CENSUS — it counts gates, runners, sources and
        # tasks, and Rev syncs — so probing it asked docd for the whole verse every five
        # seconds and made readiness a function of the STORE's load rather than of this
        # process. On staging that was unsatisfiable: versed sat 0/1 for half an hour on a
        # healthy store, and every attempt left a root watch behind (158 idle watchers in 26
        # minutes), which is what kept the store busy. /healthz answers from this process
        # alone and reads nothing (versed.healthz, pinned by TestHealthzReadsNothing).
        readinessProbe:
          httpGet:
            path: /healthz
            port: api
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
        # THERE IS NO LIVENESS PROBE, and that is a decision rather than an omission.
        #
        # The only endpoint to probe is /status, and its latency is a function of DOCD's load,
        # not of whether this process is alive. So a liveness probe on it kills the singleton
        # engine exactly when the store is struggling — and a restart makes that worse, because
        # the new process re-establishes its sessions and re-runs every source's initial
        # reconcile. It is a feedback loop, and it was observed as one twice on a k3s
        # deployment: first at the default one-second timeout, then again at five seconds with
        # six consecutive failures required, once docd was busy enough.
        #
        # A restart is not free even though this tier is stateless: reflectors restart, and a
        # level-triggered pass does not repeat what it missed, so change events go missing for
        # good. Against that, what a liveness probe buys is recovery from a wedge nothing else
        # would clear — and no wedge has been observed. Readiness stays, because taking a slow
        # engine out of its Service is cheap and reversible.
        #
        # What would earn one back: an endpoint that answers from this process alone, without
        # asking docd anything. Then "is it alive" and "is the store fast" stop being the same
        # question, which is the whole problem here.
        #
        # THAT ENDPOINT NOW EXISTS (/healthz, above), so the objection is answered and the
        # decision is open again. It is still not taken here, because the argument against was
        # two things and only one of them was the endpoint: a restart also costs every source's
        # initial reconcile, and a level-triggered pass does not repeat what it missed. So a
        # liveness probe still trades lost change events for recovery from a wedge nobody has
        # observed. Add it when a wedge is observed — on /healthz, never on /status.
