apiVersion: v1
kind: Service
metadata:
  name: verse
  labels:
    app: verse
    # `tier`, so `make ship-versed` reaches this Service too: the ship targets select one
    # tier out of the render, and an object without the label is an object nothing ships.
    tier: versed
spec:
  selector:
    app: verse
    tier: versed
  ports:
  - name: api
    port: 9797
    targetPort: api
