# The `verse-llm` Secret versed envFroms, materialised from a secret store rather than
# created by hand — so the credential is never in this tree, never in a shell history, and
# rotates without anybody visiting the cluster.
#
# Emitted only when llmSecretKey names an entry. Without it versed still deploys and runs, on
# the credential-free `scripted` driver; a hand-made Secret of the same name works exactly as
# well, and is the right answer on a cluster with no External Secrets Operator.
#
# The keys inside the entry have to be the ones verse reads — PORTKEY_API_KEY and
# PORTKEY_VIRTUAL_KEY (PORTKEY_BASE_URL and OPENAI_MODEL optional) — because `dataFrom.extract`
# copies the entry's own key names through verbatim. An entry with different names syncs
# happily and configures nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verse-llm
  labels:
    app: verse
spec:
  refreshInterval: 1h
  target:
    name: verse-llm
    creationPolicy: Owner
