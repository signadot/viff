# The codex runner: the verse runner in its own image with Codex in it, offering the codex agent
# (`agent: {name: codex}`), which it drives over Codex's client protocol so that every command
# and patch Codex proposes is decided by the task's autonomy (docs/reference/runnerd.md,
# "Codex, gated inside the run").
#
# It is a SECOND runner beside verse-runner, not a change to it: its own image, Deployment,
# Service, ConfigMap and credential, in the `runners` tier beside it with `runner: codex` to
# select it alone, so it can be removed on its own and the runner the charters name goes on
# untouched. Verse learns about it the same way:
#
#   verse runner add codex http://codex-runner:9802 --identity codex-runner \
#     --subject system:serviceaccount:verse:codex-runner
#
# Everything about the pod that is bubblewrap's — hostUsers, procMount, seccompProfile — is as
# deploy/verse-runner/verse-runner.yaml has it, and explained there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-runner-config
  labels: {app: verse, tier: runners, runner: codex}
data:
  verse-runner.tony: |
    listen: ":9802"
    # The one verse this runner serves is not here: the `runnerTokens` patch (deploy/build.tony)
    # names it in the pod's environment, VERSE_URL and VERSE_ISSUER, from the `issuer` knob,
    # since this file is every cluster's, and gives it its token (VERSE_TOKEN_FILE). The runner
    # does not start without both.
    # One bare mirror per repository, on the state volume, shared by the tasks. The forge is
    # github.com, and the token is GITHUB_TOKEN (the verse-runner Secret, below).
    repos:
      mirrors: /state/mirrors
    # The operator's line over every system a doer holds for its tasks, a doer at a time: what a
    # spawn's environment may give, held at install, at launch and again at each act. A ceiling
    # lists what it allows and nothing else is allowed, so a system with no ceiling under a doer
    # is closed to it; a block naming no verb (`{}`) allows every verb of its system.
    # signadot's repositories, and their branches under verse/; main of verse's own, which its
    # comment-drift merge lands on. No network ceiling: tasks get what the sandbox builds. What a
    # doer's shell is given of the runner's environment is its `shellEnv`, by name: never a secret.
    # Codex alone: no `script:`, so this runner offers no scripts.
    agents:
      codex:
        # How Codex runs here. The key is OPENAI_API_KEY (the verse-codex Secret, below); the
        # task process writes it as Codex's login file in a CODEX_HOME of its own, so it is in no
        # environment a command could inherit. The sandbox is Codex's own, inside bwrap's: an
        # approved command may write the workspace and /tmp, and nothing else. Codex's API is
        # reachable from a task whatever its network.
        sandbox: workspace-write
        config:
          # Go's build cache lives under the home directory, which Codex's sandbox refuses; /tmp
          # it allows.
          "shell_environment_policy.set": '{GOCACHE = "/tmp/codex-gocache"}'
          # Codex's sandbox denies commands the network by default. Here the network is the
          # launch environment's `network`, already drawn by bwrap, so Codex does not deny it
          # again.
          "sandbox_workspace_write.network_access": "true"
          # Nothing here wants a newer Codex than the one the image pins.
          "check_for_update_on_startup": "false"
        shellEnv: [PATH, HOME, USER, LANG]
        # The model is one the key's project serves, and a spawn's `agent.model` overrides it.
        settings:
          model: {default: gpt-5.3-codex}
        systems:
          git:
            ceiling:
            - repo: github.com/signadot/verse
              fetch: {}
              push:
              - {ref: refs/heads/main, force: false, delete: false}
              - {ref: !regexp "^refs/heads/verse/"}
            - repo: !regexp "^github\\.com/signadot/"
              fetch: {}
              push: {ref: !regexp "^refs/heads/verse/"}
          git-issue: {ceiling: {repo: !regexp "^github\\.com/signadot/"}}
          github: {ceiling: {repo: !regexp "^github\\.com/signadot/"}}
          github-issue: {ceiling: {repo: !regexp "^github\\.com/signadot/"}}
          # Linear and Slack, made with the credentials the iods hold (LINEAR_API_KEY from
          # verse-linear, SLACK_BOT_TOKEN from verse-slack): a ceiling naming either is what makes
          # the runner offer the system, and where its variable is unset the runner starts with it
          # closed, and says so. ENG
          # is the team the Linear iod reflects; the channels are the ones the Slack bot is in. A
          # Slack shape names one channel, so two channels are two shapes.
          linear-issue: {ceiling: {create: {team: ENG}, comment: {issue: !glob "ENG-*"}, close: {issue: !glob "ENG-*"}}}
          slack:
            ceiling:
              read: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
              post: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
              reply: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
              react: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
          files: {ceiling: {}}
          commands: {ceiling: {}}
          question: {ceiling: {}}
          verse: {ceiling: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner
  labels: {app: verse, tier: runners, runner: codex}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: verse, tier: runners, runner: codex}
  template:
    metadata:
      labels: {app: verse, tier: runners, runner: codex}
    spec:
      hostUsers: false
      containers:
      - name: codex-runner
        image: signadot/verse-runner:codex
        args:
        - -config
        - /config/verse-runner.tony
        - -sandbox
        - bwrap
        ports:
        - {name: control, containerPort: 9802}
        - {name: admin, containerPort: 9803}
        # The model key, OPENAI_API_KEY, the variable a runner running codex reads. The runner
        # holds it; the task process writes it into Codex's login file, which a command Codex
        # runs can read (docs/reference/runnerd.md, Codex). The Secret
        # comes from the store entry `codexSecretKey` names (deploy/README.md, Credentials),
        # and is made by hand only where that knob is empty:
        #
        #   kubectl -n verse create secret generic verse-codex \
        #     --from-literal=OPENAI_API_KEY=<key>
        #
        # Optional: a runner without it starts, and its first codex spawn fails.
        envFrom:
        - secretRef:
            name: verse-codex
            optional: true
        env:
        # Codex writes its logs and state under $HOME/.codex when it is given no login of its
        # own, and the login it is given lives under /tmp; either way the home has to be a
        # writable path inside the sandbox, and /tmp is the one there is.
        - name: HOME
          value: /tmp
        # What this runner pushes with: the same token verse-runner pushes with, held by a
        # different process. The task never sees it.
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef: {name: verse-runner, key: gitToken, optional: true}
        # Linear's and Slack's, for the tasks' linear-issue and slack calls: the keys the iods read
        # from the same Secrets. The runner makes each call itself, so a task never has them.
        - name: LINEAR_API_KEY
          valueFrom:
            secretKeyRef: {name: verse-linear, key: LINEAR_API_KEY, optional: true}
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef: {name: verse-slack, key: SLACK_BOT_TOKEN, optional: true}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: state, mountPath: /state}
        readinessProbe:
          # The server up, and nothing else (deploy/verse-runner, the same probe).
          httpGet: {path: /ready, port: control}
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          seccompProfile:
            type: Unconfined
          procMount: Unmasked
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: config
        configMap: {name: codex-runner-config}
      - name: state
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-runner
  labels: {app: verse, tier: runners, runner: codex}
spec:
  selector: {app: verse, tier: runners, runner: codex}
  ports:
  - {name: control, port: 9802, targetPort: control}
