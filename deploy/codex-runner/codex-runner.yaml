# The codex runner: the verse runner in its own image with Codex in it, offering the codex agent
# (`agent: {name: codex}`), which it drives over Codex's client protocol so that every command
# and patch Codex proposes is decided by the task's autonomy (docs/reference/runnerd.md,
# "Codex, gated inside the run").
#
# It is a SECOND runner beside verse-runner, not a change to it: its own image, Deployment,
# Service, ConfigMap and credential, in the `runners` tier beside it with `runner: codex` to
# select it alone, so it can be removed on its own and the runner the charters name goes on
# untouched. Verse learns about it the same way:
#
#   verse runner add codex http://codex-runner:9802 --identity codex-runner
#
# Everything about the pod that is bubblewrap's — hostUsers, procMount, seccompProfile — is as
# deploy/verse-runner/verse-runner.yaml has it, and explained there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-runner-config
  labels: {app: verse, tier: runners, runner: codex}
data:
  verse-runner.tony: |
    listen: ":9802"
    shellEnv: [PATH, HOME, USER, LANG]
    repos:
      mirrors: /state/mirrors
    # The operator's line over every system this runner holds for its tasks: what a spawn's
    # environment may give, held at install, at launch and again at each act. A ceiling lists
    # what it allows and nothing else is allowed, so a system with no ceiling here is closed; a
    # block naming no verb (`{}`) allows every verb of its system.
    # signadot's repositories, and their branches under verse/; main of verse's own, which its
    # comment-drift merge lands on. No network ceiling: tasks get what the sandbox builds.
    systems:
      git:
        ceiling:
        - repo: github.com/signadot/verse
          fetch: {}
          push:
          - {ref: refs/heads/main, force: "false", delete: "false"}
          - {ref: "refs/heads/verse/**"}
        - repo: "github.com/signadot/**"
          fetch: {}
          push: {ref: "refs/heads/verse/**"}
      git-issue: {ceiling: {repo: "github.com/signadot/**"}}
      github: {ceiling: {repo: "github.com/signadot/**"}}
      github-issue: {ceiling: {repo: "github.com/signadot/**"}}
      files: {ceiling: {}}
      commands: {ceiling: {}}
      question: {ceiling: {}}
      agent: {ceiling: {}}

    # How Codex runs here. `apiKeyEnv` is the NAME of a variable the runner holds (the
    # verse-codex Secret, below); the task process writes it as Codex's login file in a
    # CODEX_HOME of its own, so it is in no environment a command could inherit. The model is
    # one the key's project serves, and a spawn's `agent.model` overrides it. The sandbox is
    # Codex's own, inside bwrap's: an approved command may write the workspace and /tmp, and
    # nothing else. Codex's API is reachable from a task whatever its network.
    codex:
      model: gpt-5.3-codex
      sandbox: workspace-write
      apiKeyEnv: OPENAI_API_KEY
      config:
        # Go's build cache lives under the home directory, which Codex's sandbox refuses; /tmp
        # it allows.
        "shell_environment_policy.set": '{GOCACHE = "/tmp/codex-gocache"}'
        # Codex's sandbox denies commands the network by default. Here the network is the
        # launch environment's `network`, already drawn by bwrap, so Codex does not deny it again.
        "sandbox_workspace_write.network_access": "true"
        # Nothing here wants a newer Codex than the one the image pins.
        "check_for_update_on_startup": "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner
  labels: {app: verse, tier: runners, runner: codex}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: verse, tier: runners, runner: codex}
  template:
    metadata:
      labels: {app: verse, tier: runners, runner: codex}
    spec:
      hostUsers: false
      containers:
      - name: codex-runner
        image: signadot/verse-runner:codex
        args:
        - verse
        - -config
        - /config/verse-runner.tony
        - -sandbox
        - bwrap
        ports:
        - {name: control, containerPort: 9802}
        - {name: admin, containerPort: 9803}
        # The model key, by the variable name the ConfigMap's `apiKeyEnv` reads. The runner
        # holds it; the task process writes it into a login file for Codex alone. The Secret
        # comes from the store entry `codexSecretKey` names (deploy/README.md, Credentials),
        # and is made by hand only where that knob is empty:
        #
        #   kubectl -n verse create secret generic verse-codex \
        #     --from-literal=OPENAI_API_KEY=<key>
        #
        # Optional: a runner without it starts, and its first codex spawn fails.
        envFrom:
        - secretRef:
            name: verse-codex
            optional: true
        env:
        # Codex writes its logs and state under $HOME/.codex when it is given no login of its
        # own, and the login it is given lives under /tmp; either way the home has to be a
        # writable path inside the sandbox, and /tmp is the one there is.
        - name: HOME
          value: /tmp
        # What this runner pushes with: the same token verse-runner pushes with, held by a
        # different process. The task never sees it.
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef: {name: verse-runner, key: gitToken, optional: true}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: state, mountPath: /state}
        readinessProbe:
          httpGet: {path: /describe, port: control}
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          seccompProfile:
            type: Unconfined
          procMount: Unmasked
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: config
        configMap: {name: codex-runner-config}
      - name: state
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-runner
  labels: {app: verse, tier: runners, runner: codex}
spec:
  selector: {app: verse, tier: runners, runner: codex}
  ports:
  - {name: control, port: 9802, targetPort: control}
