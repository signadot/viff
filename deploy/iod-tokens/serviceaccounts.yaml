# One ServiceAccount per iod that acts for people, so that each iod's projected token names the iod
# and nothing else: `system:serviceaccount:<namespace>:slack-iod` is the Slack iod, and viff's
# `auth.iod.accounts` says so (docs/reference/perms.md, "iods at the door"). The token itself is a
# projected volume on the iod's Deployment (build.tony's iodTokens patches), asked for with the
# audience `viff`, so it is good for nothing but talking to viff.
#
# The pull secret reaches these the way it reaches `default`: build.tony's imagePullSecret patch
# covers every ServiceAccount this deploy emits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-iod
  labels:
    app: viff
    tier: iods
    io: slack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-iod
  labels:
    app: viff
    tier: iods
    io: github
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-iod
  labels:
    app: viff
    tier: iods
    io: git
