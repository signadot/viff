# The namespace's `default` ServiceAccount, taken over for one purpose: to carry an image
# pull secret. Emitted only when imagePullSecret names one.
#
# On the ServiceAccount rather than on each pod spec, because the ServiceAccount admission
# plugin copies its imagePullSecrets into every pod created in the namespace that does not
# name a different account — so versed, docd AND the source connectors get it from this one
# object, instead of a patch per Deployment that each new connector would have to remember.
#
# It is applied BEFORE the workloads (build.tony lists this dir right after the Namespace)
# because that copy happens at POD CREATION. A pod that already exists does not acquire the
# secret when the account gains it — it has to be recreated.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
