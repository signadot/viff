# One ServiceAccount per runner, so that each projected token names its pod and nothing else
# (docs/runners.md, "Who the runner is"; docs/reference/perms.md, "runners at the door"). The
# tokens are projected volumes on the Deployments (build.tony's runnerTokens patches), audience
# `viff`: what the runner answers on the describe, and presents at viffd's door, so a
# registration naming its subject (`viff runner add -subject
# system:serviceaccount:viff:viff-runner`) is held to. Viffd proves itself the other way
# round, by the tokens it signs (the viff-issuer Secret), so it needs no ServiceAccount here.
#
# The pull secret reaches these the way it reaches `default`: build.tony's imagePullSecret patch
# covers every ServiceAccount this deploy emits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viff-runner
  labels:
    app: viff
    tier: runners
    runner: viff
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-runner
  labels:
    app: viff
    tier: runners
    runner: codex
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-runner
  labels:
    app: viff
    tier: runners
    runner: claude
