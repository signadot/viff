# One ServiceAccount per runner, so that each projected token names its pod and nothing else
# (docs/runners.md, "Who the runner is"; docs/reference/perms.md, "runners at the door"). The
# tokens are projected volumes on the Deployments (build.tony's runnerTokens patches), audience
# `verse`: what the runner answers on the describe, and presents at versed's door, so a
# registration naming its subject (`verse runner add -subject
# system:serviceaccount:verse:verse-runner`) is held to. Versed proves itself the other way
# round, by the tokens it signs (the verse-issuer Secret), so it needs no ServiceAccount here.
#
# The pull secret reaches these the way it reaches `default`: build.tony's imagePullSecret patch
# covers every ServiceAccount this deploy emits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verse-runner
  labels:
    app: verse
    tier: runners
    runner: verse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-runner
  labels:
    app: verse
    tier: runners
    runner: codex
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-runner
  labels:
    app: verse
    tier: runners
    runner: claude
