# verse-runner-secrets — the runners' secret store, for what has no Secret of its own.
#
# Each key is one file in the store the three runners mount at /secrets (deploy/verse-runner),
# under its own name, so the keys are the store's names: lower case letters, digits, `-`, `_`
# and `.`, not starting with a `.` (docs/reference/runnerd.md, "The secret store"). The Linear
# and Slack tokens are NOT here: the store takes them from verse-linear and verse-slack, under
# the names `linear` and `slack-bot`, so each is kept once. This is for the rest — a credential
# a runner performs a system with that no iod holds, as an MCP server's token will be.
#
# Optional on every runner: the store is there and empty without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verse-runner-secrets
  labels:
    app: verse
spec:
  refreshInterval: 1h
  target:
    name: verse-runner-secrets
    creationPolicy: Owner
