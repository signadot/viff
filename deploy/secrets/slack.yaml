# viff-slack — keys: SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET.
#
# The Deployment's secretRef is NOT optional, deliberately: a Slack source with no token has
# nothing to reflect, so it refuses to start rather than installing clean and failing every
# pass. Which also means this ExternalSecret has to land BEFORE the connector — the dir is
# ordered ahead of source/ for exactly that.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: viff-slack
  labels:
    app: viff
spec:
  refreshInterval: 1h
  target:
    name: viff-slack
    creationPolicy: Owner
