# viff-linear — keys: LINEAR_API_KEY, LINEAR_WEBHOOK_SECRET.
#
# LINEAR_API_KEY is the Authorization header VERBATIM (cmd/iod/linear.go), so one variable
# carries both the scheme and the key. Without LINEAR_WEBHOOK_SECRET the webhook refuses
# deliveries and the source converges on the resync instead — degraded, not dead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: viff-linear
  labels:
    app: viff
spec:
  refreshInterval: 1h
  target:
    name: viff-linear
    creationPolicy: Owner
