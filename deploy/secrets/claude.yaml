# verse-claude — one key, `ANTHROPIC_API_KEY`: what the claude runner's tasks run Claude under.
#
# Its own entry because it is its own bill and its own revocation: an API key of the Console
# workspace the work is metered to, held by the claude runner and handed to each task's claude
# process (deploy/claude-runner). Taking it away stops the claude agent and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verse-claude
  labels:
    app: verse
spec:
  refreshInterval: 1h
  target:
    name: verse-claude
    creationPolicy: Owner
