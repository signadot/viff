# Every Secret this deploy NAMES but does not carry, one file each, materialised from a secret
# store by the External Secrets Operator. Emitted only when its knob names an entry; without
# the knob the file is deleted from the render and the Secret is yours to create by hand,
# which is the right answer on a cluster with no ESO.
#
# `dataFrom.extract` copies the entry's OWN key names into the Secret. So the entry has to
# spell the names the consumer reads — deploy/README.md has the table — and an entry that
# spells them differently syncs green and configures nothing. That is the failure mode this
# whole directory is shaped around; it is why each file says its keys here, next to the thing
# that needs them.
#
# verse-llm — versed's envFrom AND the coderunner's. Keys: PORTKEY_API_KEY,
# PORTKEY_VIRTUAL_KEY (PORTKEY_BASE_URL, OPENAI_MODEL optional; llmModel beats the latter).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verse-llm
  labels:
    app: verse
spec:
  refreshInterval: 1h
  target:
    name: verse-llm
    creationPolicy: Owner
