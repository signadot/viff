# viff-issuer — one key, `issuer.pem`: the RSA private key viffd signs its own tokens with.
#
# Viffd is an issuer (the auth file's `auth.issuer`): the credential a gate mints for a task, and
# the token it presents to each runner, minted for that runner alone (docs/runners.md, "Who the
# runner is"). The key is mounted into viffd as a file (build.tony's runnerTokens patch) and
# read by nobody else; its public half is what the runners fetch at /.well-known/jwks.json.
# `openssl genrsa -out issuer.pem 2048` makes one. Viffd reads the key at start, so rotating it
# is replacing the entry, waiting for the sync, and rolling viffd: every token the old key signed
# dies at the restart, a runner's within ten minutes, and the runners refetch the keys when a
# token names a `kid` they do not hold.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: viff-issuer
  labels:
    app: viff
spec:
  refreshInterval: 1h
  target:
    name: viff-issuer
    creationPolicy: Owner
