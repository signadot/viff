# viff-runner — one key, `gitToken`: what the runner PUSHES with.
#
# Separate from viff-git even when it is the same PAT, because they are held differently: the
# git source reads its credential through a helper in its own process, and this one never
# enters the sandbox at all — delivery is the runner's act, and the agent has neither the
# variable nor a shell to read it from. One entry per holder keeps that revocable separately.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: viff-runner
  labels:
    app: viff
spec:
  refreshInterval: 1h
  target:
    name: viff-runner
    creationPolicy: Owner
