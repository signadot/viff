# viff-codex — one key, `OPENAI_API_KEY`: what the codex runner's tasks run Codex under.
#
# Its own entry because it is its own bill and its own revocation: an OpenAI platform key the
# work is metered to, held by the codex runner and written as each task's Codex login
# (deploy/codex-runner). Taking it away stops the codex agent and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: viff-codex
  labels:
    app: viff
spec:
  refreshInterval: 1h
  target:
    name: viff-codex
    creationPolicy: Owner
