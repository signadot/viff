# verse-github — keys: GITHUB_TOKEN, GITHUB_WEBHOOK_SECRET.
#
# A fine-grained PAT with read access to the repositories in `githubRepos`. As with Linear, a
# missing webhook secret costs deliveries and not the source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verse-github
  labels:
    app: verse
spec:
  refreshInterval: 1h
  target:
    name: verse-github
    creationPolicy: Owner
