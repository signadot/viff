# viff-github — keys: GITHUB_TOKEN, or GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID and
# GITHUB_APP_PRIVATE_KEY; and GITHUB_WEBHOOK_SECRET.
#
# A fine-grained PAT with read access to the repositories in `githubRepos`, or a GitHub App's
# installation on them, which is used when both are present. As with Linear, a
# missing webhook secret costs deliveries and not the source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: viff-github
  labels:
    app: viff
spec:
  refreshInterval: 1h
  target:
    name: viff-github
    creationPolicy: Owner
