# verse-git — the git source's credential, MOUNTED as a file at /git-credentials/credential
# and read by a git credential helper, not an env var. So the entry needs one key spelled
# `credential`, whose value is what the helper prints:
#
#   credential: "username=x-access-token\npassword=<PAT>\n"
#
# The trailing newline matters to git. The token is here rather than in the `-mirror` url
# because the url is in the pod spec, and a pod spec is not a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verse-git
  labels:
    app: verse
spec:
  refreshInterval: 1h
  target:
    name: verse-git
    creationPolicy: Owner
