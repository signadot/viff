# One ServiceAccount per io that acts for people, so that each io's projected token names the io
# and nothing else: `system:serviceaccount:<namespace>:slack-io` is the Slack io, and verse's
# `auth.iod.accounts` says so (docs/reference/perms.md, "ios at the door"). The token itself is a
# projected volume on the io's Deployment (build.tony's ioTokens patches), asked for with the
# audience `verse`, so it is good for nothing but talking to verse.
#
# The pull secret reaches these the way it reaches `default`: build.tony's imagePullSecret patch
# covers every ServiceAccount this deploy emits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-io
  labels:
    app: verse
    tier: io
    io: slack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-io
  labels:
    app: verse
    tier: io
    io: github
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-io
  labels:
    app: verse
    tier: io
    io: git
