# The git Source, as a deployed program: `sourced git`, mirroring a remote.
#
# A pod has no repositories, so this one makes its own — `-mirror` clones the remote at
# startup and fetches on every pass. That is the read; nothing is ever pushed. For a repo that
# already exists somewhere (a build host, a laptop), run the same binary there with `-repo`
# instead, or use verse's in-process path (`verse source add --dir`) and skip this entirely.
#
# Install it once the pods are up. The name is free here, unlike the Slack/Linear/GitHub ones:
# those bake a hint url containing their name into the pod, so the name has to be decided
# before it starts and there is a `<x>SourceName` knob for it. This one is polled and posts no
# hints, so there is nothing to match and no knob (there never was a `gitSourceName`).
#   verse source add git:cluster http://git-source:9801
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-source
  labels:
    app: verse
    tier: source
    source: git
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods would each hold a mirror and verse would dial
  # whichever the Service picked, so a fetch's timing would decide which answer a pass got.
  # A source is the single writer of its slice; running two of it is the thing the install's
  # disjointness check exists to prevent, arriving through the deployment instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verse
      tier: source
      source: git
  template:
    metadata:
      labels:
        app: verse
        tier: source
        source: git
    spec:
      containers:
      - name: git-source
        image: signadot/verse:latest
        # The mirror spec comes from the build (`-e gitMirror=…`); see deploy/build.tony.
        command:
        - sourced
        - git
        - -addr
        - :9801
        - -state
        - /repos
        - -mirror
        - https://github.com/signadot/verse.git
        ports:
        - name: source
          containerPort: 9801
        # Credentials for a private mirror. Unconditional, and harmless without them: the
        # Secret is `optional`, so a missing one mounts an empty directory, the helper below
        # answers nothing, and git proceeds anonymously — which is exactly what a public
        # mirror wants. That is why this is not a knob. Create it and the same pod reaches a
        # private remote:
        #
        #   kubectl -n verse create secret generic verse-git \
        #     --from-literal=credential=$'username=x-access-token\npassword=<PAT>\n'
        #
        # GIT_CONFIG_* rather than a token in the -mirror url, because the url is in the pod
        # spec and a pod spec is not a secret.
        #
        # A READ-ONLY helper, not `store --file=…`: store WRITES the file back — on success
        # (approve) and on failure (erase) alike — so against a read-only Secret mount it
        # spends a 1000ms lock timeout and prints a fatal-looking line on every clone and
        # every fetch, which is once a minute forever. This one only ever reads, and answers
        # nothing for `store` and `erase`.
        env:
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: credential.helper
        - name: GIT_CONFIG_VALUE_0
          value: '!f() { if [ "$1" = get ]; then cat /git-credentials/credential 2>/dev/null; fi; }; f'
        volumeMounts:
        - name: repos
          mountPath: /repos
        - name: git-credentials
          mountPath: /git-credentials
          readOnly: true
        readinessProbe:
          # GET /source is the contract's own "what are you", which is exactly the question a
          # readiness probe is asking. A source that cannot answer it is one verse's install
          # probe would call unreachable.
          httpGet:
            path: /source
            port: source
          initialDelaySeconds: 3
          periodSeconds: 10
          # Explicit, for the reason versed's are (see deploy/source/versed-deployment.yaml):
          # the default is one second, and /source is answered by a program that may be busy
          # talking to somebody else's API.
          timeoutSeconds: 5
      volumes:
      # An emptyDir, so this needs no storage at all: the mirror is a cache of a remote that is
      # still the truth, and a restart re-clones it. Swap in a PVC when the clone is expensive
      # enough that paying for it on every rollout is worse than paying for a volume — nothing
      # else changes.
      - name: repos
        emptyDir: {}
      - name: git-credentials
        secret:
          secretName: verse-git
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: git-source
  labels:
    app: verse
    tier: source
    source: git
spec:
  selector:
    app: verse
    tier: source
    source: git
  ports:
  - name: source
    port: 9801
    targetPort: source
