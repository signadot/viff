# The charter versed installs at start as the system (VERSE_SYSTEM_CHARTER): the file
# `systemCharter` names, carried in whole. Only a binary is in the image, so the file comes in
# as a ConfigMap mounted into versed (deploy/build.tony's systemCharter patch).
apiVersion: v1
kind: ConfigMap
metadata:
  name: verse-system-charter
  labels:
    app: verse
data:
  system.tony: !file $[systemCharter]
