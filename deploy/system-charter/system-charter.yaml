# The charter viffd installs at start as the system (VIFF_SYSTEM_CHARTER): the file
# `systemCharter` names, carried in whole. Only a binary is in the image, so the file comes in
# as a ConfigMap mounted into viffd (deploy/build.tony's systemCharter patch).
apiVersion: v1
kind: ConfigMap
metadata:
  name: viff-system-charter
  labels:
    app: viff
data:
  system.tony: !file $[systemCharter]
