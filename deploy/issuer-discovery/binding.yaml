# The API server's OpenID discovery document and keys, readable by anyone who reaches it: what
# versed needs to verify the ios' projected tokens on a cluster whose issuer is the API server
# itself (minikube, kubeadm), where the default grants the read to service accounts alone and
# versed reads as nobody. A public issuer (EKS) needs none of this; the knob is off unless a
# profile says otherwise. Cluster-scoped, so no namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verse-issuer-discovery
  labels:
    app: verse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:unauthenticated
