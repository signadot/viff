# The logd snapshot policy, for a store that needs its own.
#
# It is a separate directory — and off unless a profile asks for it — for the reason
# docd-statefulset.yaml gives at length: a server with no config takes upstream's
# DefaultConfig(), and freezing this deployment on today's guess would be worse than taking
# theirs. What is here is the exception that comment already names: a store whose write
# pattern is nothing like the guess.
#
# WHAT MAKES A STORE NEED ONE. A source's first pass writes one entity per commit, so
# reflecting a repository is thousands of commits in a burst. At the default of 1000 a
# snapshot fires every few seconds during that burst, and a snapshot rewrites the WHOLE
# document — so the tax grows with the store while the burst is still running. Staging showed
# it plainly: commits 1000, 2000 and 3000 inside one minute, the snapshots taking 3s then 7s,
# with `verse status` a minute behind them.
#
# Raising the thresholds does not make a bulk load fast. One commit per entity on a session
# that serializes is the ceiling, and lifting that is a different piece of work. This stops the
# load paying a growing tax on top of it.
#
# The numbers are LITERAL rather than templated, and that is deliberate: `$[…]` is not expanded
# inside a YAML block scalar, and a patch cannot reach the key either, since `logd.tony` carries
# a dot and a patch path reads it as `logd` → `tony`. Both ways fail by shipping a config logd
# cannot read, which stops the store rather than tuning it. So the policy lives here beside its
# reasoning, and a store wanting different numbers edits this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logd-config
  labels: {app: verse, tier: store}
data:
  # Both thresholds, because they measure different things and upstream is explicit that
  # maxBytes is the one to rely on: it measures the delta a read has to replay, on the file, so
  # it means the same to a process that has just started as to one up for weeks. maxCommits
  # counts commits THIS process has seen and resets on restart — a pod that restarts often
  # enough never reaches it, which is one of the two ways a store once reached 15 MB of log
  # with an empty snapshot file (tony-format ps8kfs9d).
  logd.tony: |
    snapshot: {
      maxCommits: 25000
      maxBytes:   67108864
    }
