apiVersion: v1
kind: PersistentVolume
metadata:
  name: viff-docd-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  # Static binding: an empty class disables dynamic provisioning; the docd VCT (also class
  # "") binds to this PV. claimRef pre-binds it to the StatefulSet's generated PVC.
  storageClassName: ""
  hostPath:
    path: /mnt/viff
  claimRef:
    namespace: viff
    name: data-docd-0
