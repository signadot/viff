# The claude runner: the verse runner in its own image with Claude Code in it, offering the
# claude agent (`agent: {name: claude}`), which it drives over Claude Code's stream protocol so
# that every command, edit and question Claude proposes is decided by the task's autonomy
# (docs/reference/runnerd.md, "Claude, gated inside the run").
#
# It is a THIRD runner beside verse-runner and codex-runner, not a change to either: its own
# image, Deployment, Service, ConfigMap and credential, in the `runners` tier beside them with
# `runner: claude` to select it alone, so it can be removed on its own and the runners the
# charters name go on untouched. Verse learns about it the same way:
#
#   verse runner add claude http://claude-runner:9802 --identity claude-runner \
#     --subject system:serviceaccount:verse:claude-runner
#
# Everything about the pod that is bubblewrap's — hostUsers, procMount, seccompProfile — is as
# deploy/verse-runner/verse-runner.yaml has it, and explained there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-runner-config
  labels: {app: verse, tier: runners, runner: claude}
data:
  verse-runner.tony: |
    listen: ":9802"
    # The one verse this runner serves is not here: the `runnerTokens` patch (deploy/build.tony)
    # names it in the pod's environment, VERSE_URL and VERSE_ISSUER, from the `issuer` knob,
    # since this file is every cluster's, and gives it its token (VERSE_TOKEN_FILE). The runner
    # does not start without both.
    # One bare mirror per repository, on the state volume, shared by the tasks. The forge is
    # github.com, and the token is GITHUB_TOKEN (the verse-runner Secret, below).
    repos:
      mirrors: /state/mirrors
    # The operator's line over every system a doer holds for its tasks, a doer at a time: what a
    # spawn's environment may give, held at install, at launch and again at each act. A ceiling
    # lists what it allows and nothing else is allowed, so a system with no ceiling under a doer
    # is closed to it; a block naming no verb (`{}`) allows every verb of its system.
    # signadot's repositories, and their branches under verse/; main of verse's own, which its
    # comment-drift merge lands on. No network ceiling: tasks get what the sandbox builds. What a
    # doer's shell is given of the runner's environment is its `shellEnv`, by name: never a secret.
    # Claude alone: no `script:`, so this runner offers no scripts.
    agents:
      claude:
        # How Claude runs here. The credential is ANTHROPIC_API_KEY (the verse-claude Secret,
        # below), or CLAUDE_CODE_OAUTH_TOKEN where that is set; the task process puts it in the
        # claude process's environment under its own name, with a CLAUDE_CONFIG_DIR of the
        # task's own. Claude's API is reachable from a task whatever its network.
        shellEnv: [PATH, HOME, USER, LANG]
        # The model is an alias Claude Code resolves to the current one of that family, and a
        # spawn's `agent.model` overrides it.
        settings:
          model: {default: sonnet}
        systems:
          git:
            ceiling:
            - repo: github.com/signadot/verse
              fetch: {}
              push:
              - {ref: refs/heads/main, force: "false", delete: "false"}
              - {ref: "refs/heads/verse/**"}
            - repo: "github.com/signadot/**"
              fetch: {}
              push: {ref: "refs/heads/verse/**"}
          git-issue: {ceiling: {repo: "github.com/signadot/**"}}
          github: {ceiling: {repo: "github.com/signadot/**"}}
          github-issue: {ceiling: {repo: "github.com/signadot/**"}}
          # Linear and Slack, made with the credentials the iods hold (LINEAR_API_KEY from
          # verse-linear, SLACK_BOT_TOKEN from verse-slack): a ceiling naming either is what makes
          # the runner offer the system, and where its variable is unset the runner starts with it
          # closed, and says so. ENG
          # is the team the Linear iod reflects; the channels are the ones the Slack bot is in. A
          # Slack shape names one channel, so two channels are two shapes.
          linear-issue: {ceiling: {create: {team: ENG}, comment: {issue: "ENG-*"}, close: {issue: "ENG-*"}}}
          slack:
            ceiling:
              read: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
              post: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
              reply: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
              react: [{channel: verse-dev}, {channel: verse-dev-slackio-testing}]
          files: {ceiling: {}}
          commands: {ceiling: {}}
          question: {ceiling: {}}
          verse: {ceiling: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-runner
  labels: {app: verse, tier: runners, runner: claude}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: verse, tier: runners, runner: claude}
  template:
    metadata:
      labels: {app: verse, tier: runners, runner: claude}
    spec:
      hostUsers: false
      containers:
      - name: claude-runner
        image: signadot/verse-runner:claude
        args:
        - -config
        - /config/verse-runner.tony
        - -sandbox
        - bwrap
        ports:
        - {name: control, containerPort: 9802}
        - {name: admin, containerPort: 9803}
        # The credential, ANTHROPIC_API_KEY, which a runner running claude reads where no
        # CLAUDE_CODE_OAUTH_TOKEN is set. The
        # runner holds it; the task process puts it in the claude process's environment, which
        # every command Claude runs inherits (docs/reference/runnerd.md, Claude). The Secret
        # comes from the store entry `claudeSecretKey` names (deploy/README.md, Credentials),
        # and is made by hand only where that knob is empty:
        #
        #   kubectl -n verse create secret generic verse-claude \
        #     --from-literal=ANTHROPIC_API_KEY=<key>
        #
        # Optional: a runner without it starts, and its first claude spawn fails, not logged in.
        envFrom:
        - secretRef:
            name: verse-claude
            optional: true
        env:
        # Claude writes its state under $HOME when it is given no CLAUDE_CONFIG_DIR, and the
        # one it is given lives under /tmp; either way the home has to be a writable path
        # inside the sandbox, and /tmp is the one there is.
        - name: HOME
          value: /tmp
        # What this runner pushes with: the same token verse-runner pushes with, held by a
        # different process. The task never sees it.
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef: {name: verse-runner, key: gitToken, optional: true}
        # Linear's and Slack's, for the tasks' linear-issue and slack calls: the keys the iods read
        # from the same Secrets. The runner makes each call itself, so a task never has them.
        - name: LINEAR_API_KEY
          valueFrom:
            secretKeyRef: {name: verse-linear, key: LINEAR_API_KEY, optional: true}
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef: {name: verse-slack, key: SLACK_BOT_TOKEN, optional: true}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: state, mountPath: /state}
        readinessProbe:
          # The server up, and nothing else (deploy/verse-runner, the same probe).
          httpGet: {path: /ready, port: control}
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          seccompProfile:
            type: Unconfined
          procMount: Unmasked
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: config
        configMap: {name: claude-runner-config}
      - name: state
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: claude-runner
  labels: {app: verse, tier: runners, runner: claude}
spec:
  selector: {app: verse, tier: runners, runner: claude}
  ports:
  - {name: control, port: 9802, targetPort: control}
