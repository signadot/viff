# The runner's state volume: the mirrors — a cache that survives a restart, and where a commit
# that could not be delivered waits under refs/pending/<task> or refs/held/... — and the pkg
# cellar. What this replaces is an emptyDir, where both died with the pod, and runnerStateSize ""
# is still that.
#
# ReadWriteOnce because the Deployment's strategy is Recreate: one writer, since two pods writing
# one mirror is a fetch racing a fetch. The size here is the base; runnerStateSize re-states it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-runner-state
  labels: {app: viff, tier: runners, runner: claude}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
