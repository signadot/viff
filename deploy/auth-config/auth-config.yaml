# verse's `auth` block, as a file: who verifies people, which ios are trusted for whose accounts,
# and how the ios prove themselves (docs/reference/up.md, `auth`). The file `authConfig` names,
# carried in whole, and named to versed by VERSE_CONFIG (deploy/build.tony's authConfig patch).
# Only a binary is in the image, so the file comes in as a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: verse-auth
  labels:
    app: verse
data:
  verse.tony: !file $[authConfig]
