# The coderunner, as a deployed runner: a workspace per task, a PROCESS per task, and bubblewrap
# around the process.
#
# The pod runs one coderunner that hosts no task itself. Each task is `coderunner -task` under
# bwrap, serving the same task-control contract back to its parent over an inherited socket, and
# the parent forwards verse's requests to it. So the sandbox is drawn once, around everything the
# task does — including the shell — and the git credential below stays outside it by construction
# rather than by an env allowlist.
#
# It is not a source and not the engine — it is a place work RUNS, reached by url, and verse
# learns about it the same way it learns about any runner:
#
#   verse runner add coderunner http://coderunner:9802 --identity coderunner
#
# That install probes it, so a `reach: "a runner"` is the deployment's own acceptance test.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coderunner-config
  labels: {app: verse, tier: runner}
data:
  # An environment names what a task runs with: the driver, the tools, the shell's allowlist and
  # the egress. The repositories, and what may be pushed to each, are the spawn's. Nothing here
  # is a default the image could have guessed: what a task runs with is a deployment's to state.
  #
  # `tools:` is what the llm driver gets when the spawn names none. No `run_bash`: the file
  # tools are confined to the workspace by construction, a shell is the one that can leave, and
  # a docs task does not need one. Withholding it is a stronger statement than any prompt.
  coderunner.tony: |
    default: verse-docs

    # The model credentials are read from the runner's environment, by the names versed uses
    # too: PORTKEY_API_KEY, PORTKEY_VIRTUAL_KEY (envFrom the verse-llm Secret, below).
    models:
      # A model the virtual key's provider serves, and the same one versed is given
      # (deploy/profiles/staging.tony): one credential, one provider, one answer about which
      # model this deployment runs.
      model: claude-sonnet-5
    # A spawn that names a virtual key of its own runs under it: verse read it from the address
    # the spawn named, as whoever named it, and refused there if that read was not theirs.
    annotations:
      verse.portkey/virtual-key: string

    environments:
    - name: verse-docs
      # The repositories a task works in, and what it may push to each, are the SPAWN's to say
      # (`repos:` on the charter). The runner checks them against this environment, pushes from
      # its own mirror with its own token, and the task never has a route to the forge.
      driver: llm
      tools: [read_file, list_dir, write_file, push, fetch]
      commands: [go, gofmt]
      env: [PATH, HOME, USER, LANG]
      # The way out, and the only one. Declaring this IS declaring a restricted network: the
      # task process runs with its network unshared, so it has
      # no route anywhere, and one socket is bound back in that reaches an allowlisting proxy in
      # the runner. Everything else fails with the list in the error message.
      #
      # This is what bounds the model key, which HAS to be inside the sandbox — the llm driver
      # makes the call. A key in a box that can only reach the model API is bounded; the same key
      # in a box that can reach anything is not. One mechanism for every secret, rather than one
      # proxy per secret.
      #
      # It needs bwrap, which is why `-confine bwrap` below is not optional for this environment:
      # a sandbox that cannot unshare the network REFUSES the launch rather than running the
      # task with a proxy it is free to ignore.
      # api.portkey.ai, NOT the model vendor: the driver dials Portkey's gateway (the harness
      # defaults there when no baseUrl is set), and which provider sits behind the virtual key
      # is Portkey's business, not a route the task has. Allowlisting the vendor instead buys a
      # refused model call with the allowlist in the message — loud, but not until the first
      # spawn, and the config reads right until then.
      egress:
      - api.portkey.ai
      - proxy.golang.org
      - sum.golang.org

    # The fixing environment: read the repository, correct what disagrees with the code, and
    # leave it on a branch somebody can diff.
    #
    # It is the same repository as verse-docs and differs in two ways, both of which are the
    # charter that uses it (.verse/charters/comment-drift/merge.tony) asking for something the
    # docs environment does not need.
    #
    # It PUSHES, which is the whole shape of the deliverable: a stale comment is cheap to read
    # as a diff and expensive to read as prose about a diff, and a branch is droppable in a way
    # a report on an entity is not. The push is an ACTION of the task, carrying the ref it will
    # touch, and approval is what makes the runner push it — so a charter can decline it and a
    # decline means nothing moves. A run that changed nothing proposes nothing,
    # so a commit with no stale comment in it leaves no branch.
    #
    # A SHELL, and `git` on the PATH — which the image's own Dockerfile keeps OFF a task's PATH
    # on purpose, and it is worth saying exactly why that is not being undone here. The shell has
    # no route to github.com and no credential: the runner pushes, from its own mirror, with a
    # token that is never in the task's process. So `git` in here can read this clone and can
    # push nothing. What a shell buys is the one question a charter cannot answer for itself:
    # which files a commit changed. `git.<repo>.commit.*` carries the sha, the message and the
    # trailers, and not the paths, so without a shell the task cannot find out what it is
    # reviewing. The day that list is a field on the commit entity, this environment goes back
    # to the file tools alone — that is the first item in the note.
    #
    # `call_agent`, because the unit of review is a FILE and this task is handed a commit. verse
    # fans out per entity and a changed file is not one, so the fan-out lands inside the task.
    - name: verse-fix
      # The repository is the spawn's: .verse/charters/comment-drift/drift.tony names
      # signadot/verse and permits only a proposal branch of the task's own.
      driver: llm
      # `push` is here because delivery is the agent's: it commits what it means to deliver and
      # calls `push`, and an agent without the tool delivers nothing. What keeps "a fix proposes
      # and does not land" is the charter's allowance: a proposal branch is the only kind it
      # permits.
      tools: [read_file, list_dir, write_file, run_bash, call_agent, push, fetch]
      commands: [git, go, gofmt]
      env: [PATH, HOME, USER, LANG]
      egress:
      - api.portkey.ai
      - proxy.golang.org
      - sum.golang.org

    # The merging environment: take a branch somebody already approved and put it on main.
    #
    # IT IS A SEPARATE ENVIRONMENT AND THAT IS THE WHOLE POINT. Everything here could have been
    # two more lines on `verse-fix` — one branch, one tool — and the cost of that would have
    # been paid somewhere else: that environment is shared, comment-drift spawns into it with
    # `vector: auto`, and nothing in the loop would then stop a fix task asking for `main`. The
    # containment would have been "every charter that uses this remembers to narrow its own
    # spawn", which is a rule somebody forgets rather than a property anything holds.
    #
    # Split, the reasoning is structural: what a task may reach is what its environment declares,
    # and a charter that has not been pointed here cannot reach main however its vector is set.
    # An environment is the unit this runner already has for that; using it is cheaper than
    # inventing a second answer.
    - name: verse-merge
      # The repository is the spawn's: .verse/charters/comment-drift/merge.tony names
      # signadot/verse with main as a fast-forward and the proposal branches as deletable. What
      # stops a push to main being merely a prompt is `receive.denyNonFastForwards` on main at
      # the far end, and `receive.denyDeletes` must NOT be set on verse/auto/* there, or the
      # sweep is refused every time — the one rule that has to be ABSENT rather than present.
      driver: llm
      # A shell to run the merge, `push` to send it and to retire, and the read tools so a model
      # that wants to look before it merges can. No `write_file`: a merge that hand-edits a file is not a
      # merge. No `call_agent`: there is nothing here to fan out over.
      tools: [read_file, list_dir, run_bash, push, fetch]
      commands: [git]
      env: [PATH, HOME, USER, LANG]
      # No module proxy: a merge does not build. The model call, and nothing else: the runner
      # pushes, so the task has no route to the forge.
      egress:
      - api.portkey.ai

    # ── example/app ──────────────────────────────────────────────────────────
    #
    # The same pair for the product repository, and one thing about it decides their shape:
    # master is PROTECTED — a review, status checks and a merge queue, and nobody pushes to it.
    # So the consequential branch here is not `main` but the train a pull request is from: the
    # push proposes, the forge asks, and the merge is the queue's. The charters are
    # deploy/charters/example/repo/app/{comment-drift,pr}.tony.
    #
    # The token this runner holds (-git-token-env) pushes to this repository too, so it needs
    # contents: write on example/app, and pull_requests: write for the pull request the
    # train is proposed through.
    #
    # THE FIXING ENVIRONMENT, and it is verse-fix with the repository swapped. A monorepo of
    # several Go modules, so `go` runs inside whichever module the task cds into; the prompt
    # says so, and the module proxy is here for `go doc` the same as it is for verse.
    - name: signadot-fix
      # The repository is the spawn's: deploy/charters/example/repo/app/comment-drift.tony
      # names example/app at the branch it reviews, and permits only a proposal branch.
      driver: llm
      tools: [read_file, list_dir, write_file, run_bash, call_agent, push, fetch]
      commands: [git, go, gofmt]
      env: [PATH, HOME, USER, LANG]
      egress:
      - api.portkey.ai
      - proxy.golang.org
      - sum.golang.org

    # THE PULL REQUEST ENVIRONMENT: verse-merge with `main` replaced by `verse/train`.
    #
    # `verse/train` is one branch, REWRITTEN by every tip's train: it is the run's own (a `new`
    # pattern, literal), so a push may rewrite it, and here the overwrite is the point — the
    # pull request's head is this branch, so a push to it is the update, and one open pull
    # request follows master rather than one per tip.
    #
    # The pull request itself is opened through the API, from this branch into master, and the
    # body is the reader's map back to verse: git issue sxz4wejmh12kshy5g9n0 is that the
    # charter cannot say which car it left behind, and until it can, the train entity's
    # `branches` beside the pull request's commits is where a person sees it.
    - name: signadot-pr
      # The repository is the spawn's: deploy/charters/example/repo/app/pr.tony names
      # example/app with the train as the run's own branch and the proposals as deletable.
      driver: llm
      tools: [read_file, list_dir, run_bash, push, fetch, create-pr, update-pr]
      commands: [git]
      env: [PATH, HOME, USER, LANG]
      egress:
      - api.portkey.ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderunner
  labels: {app: verse, tier: runner, runner: code}
spec:
  replicas: 1
  # Recreate, for a reason a source shares and a runner has more sharply: the mirrors and
  # workspaces live on one volume, and two pods writing one mirror is a fetch racing a fetch.
  # It also keeps `verse runner remove` honest — the work on a runner is on THAT pod, and a
  # second replica would make "3 tasks are running on it" ambiguous about where.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: verse, tier: runner, runner: code}
  template:
    metadata:
      labels: {app: verse, tier: runner, runner: code}
    spec:
      # The pod gets its own user namespace, which is here for two reasons and only one of
      # them is bwrap's. The API requires it before it will accept `procMount: Unmasked`
      # below — "hostUsers must be false to use Unmasked" is the literal refusal — and it is
      # also what makes the two relaxations below affordable: a process making unfiltered
      # syscalls against an unmasked /proc from inside its own user namespace is not the same
      # exposure as one doing it in the host's.
      hostUsers: false
      containers:
      - name: coderunner
        image: example/verse-coderunner:latest
        args:
        - -config
        - /config/coderunner.tony
        - -data
        - /state
        - -addr
        - :9802
        # The containment, named rather than sniffed. If the kernel refuses unprivileged user
        # namespaces this runner REFUSES the spawn naming the rung it could not build — it does
        # not run the work uncontained. That is the failure mode to want: a spawn that fails
        # loudly beats an agent with the run of the pod.
        - -confine
        - bwrap
        ports:
        - {name: control, containerPort: 9802}
        # pprof and stacks, one port up from -addr (adminface) — the only way to see what a
        # task's goroutines are doing on a box `kubectl exec` is not going to reach into.
        - {name: admin, containerPort: 9803}
        # The model credentials the llm driver uses. The config above names the ENV VARS it
        # reads and never values, so the ConfigMap carries no secret and stays readable by
        # anyone who can read the deployment.
        #
        # envFrom takes the Secret's own key names as variable names — verse-llm, the one
        # versed uses, whose keys ARE those names (PORTKEY_API_KEY, PORTKEY_VIRTUAL_KEY). The
        # whole Secret rather than named keys, because a secretKeyRef with optional: true is
        # SILENT about a key that is not there: the pod comes up with no credential and every
        # task dies at the model call. Taking the whole Secret cannot drift from it.
        envFrom:
        - secretRef:
            name: verse-llm
            optional: true
        env:
        # What this runner pushes with. The TASK never sees it: delivery is the runner's act,
        # in the runner's process, and the agent has neither the variable nor a shell to read
        # it from.
        #
        #   kubectl -n verse create secret generic verse-coderunner \
        #     --from-literal=gitToken=<PAT>
        - name: CODERUNNER_GIT_TOKEN
          valueFrom:
            secretKeyRef: {name: verse-coderunner, key: gitToken, optional: true}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: state, mountPath: /state}
        readinessProbe:
          # GET /tasks is what verse's own install probe asks — the cheapest question with an
          # answer, and the one that decides whether this is a runner at all. A readiness probe
          # asking anything else would be a second opinion about the same thing.
          httpGet: {path: /tasks, port: control}
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          # bubblewrap needs to create user namespaces, which is unprivileged on a kernel that
          # allows it — no CAP_SYS_ADMIN, no privileged: true. What it does need is for the
          # runtime not to block the clone: some default seccomp profiles do. If containment
          # fails here it fails as a refused spawn, which is the diagnosis you want.
          #
          # And one does. Bottlerocket's kubelet applies RuntimeDefault to every pod that names
          # no profile, and containerd's default profile masks the namespace flags out of
          # `clone` unless the caller holds CAP_SYS_ADMIN — which is dropped three lines down,
          # on purpose. So the syscall returns EPERM and bwrap reports "No permissions to
          # create new namespace, likely because the kernel does not allow non-privileged user
          # namespaces", which sends you to a sysctl that is fine (max_user_namespaces was
          # 15000 on the node this was found on). The kernel allows it; the filter does not.
          #
          # Unconfined is a real trade and worth stating: this pod loses the runtime's blanket
          # syscall filter so that the TASK can be given namespace containment. It is the right
          # way round for the threat here — the runner binary is ours and the agent is not, and
          # without this the runner refuses every spawn, so the strictly safer pod is one that
          # runs nothing. A Localhost profile (RuntimeDefault plus the clone flags) is the
          # tighter answer and costs a profile file on every node.
          seccompProfile:
            type: Unconfined
          # And the second one, found the same way: with the filter lifted, bwrap got as far
          # as `Can't mount proc on /newroot/proc: Operation not permitted`. --unshare-pid and
          # --proc /proc were already in the argv, so the PID namespace was not the problem.
          # The runtime masks eleven paths under /proc (bus, fs, irq, sys, sysrq-trigger
          # read-only; acpi, interrupts, kcore, keys, latency_stats, timer_list covered), and
          # since Linux 4.x an unprivileged user namespace may only mount a fresh procfs when
          # it can already see a FULLY VISIBLE one. Eleven submounts is not fully visible.
          #
          # Unmasked lifts the covers so the mount is allowed. What made it acceptable is
          # hostUsers above: the masking exists to keep a container from reading the HOST's
          # /proc, and in its own user namespace that is not what it is reading.
          procMount: Unmasked
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: config
        configMap: {name: coderunner-config}
      # emptyDir is wrong here and is left as the thing you change first.
      #
      # /state holds the mirrors, and the mirrors hold WORK: a delivery that could
      # not reach its remote leaves the commit under `refs/pending/<task>/<repo>` for the runner
      # to retry, and a refused one leaves it under `refs/held/...` for somebody to look at. On an
      # emptyDir all of that dies with the pod, so "the work is safe in the mirror" is only true
      # relative to the workspace being removed.
      #
      # A PVC also makes the mirrors what they are meant to be — a cache that survives restarts,
      # which is the whole reason a task's clone costs no network. Recreate above already means
      # one writer, so ReadWriteOnce is the right access mode.
      - name: state
        emptyDir: {}
      # - name: state
      #   persistentVolumeClaim: {claimName: coderunner-state}
---
apiVersion: v1
kind: Service
metadata:
  name: coderunner
  labels: {app: verse, tier: runner, runner: code}
spec:
  selector: {app: verse, tier: runner, runner: code}
  ports:
  - {name: control, port: 9802, targetPort: control}
